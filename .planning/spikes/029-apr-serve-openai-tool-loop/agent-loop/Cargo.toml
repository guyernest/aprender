[package]
name = "spike029-agent-loop"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (not a workspace member). Build with CARGO_TARGET_DIR=../../../../target
# so it shares the compiled deps with the other spikes (CONVENTIONS.md).
[workspace]

[dependencies]
# pmcp.run's SDK agent loop and its OpenAI-compatible completion source — the real client,
# composed by path, never forked (CONVENTIONS.md). ~/Development/mcp/sdk/rust-mcp-sdk.
pmcp-agent = { path = "../../../../../../mcp/sdk/rust-mcp-sdk/crates/pmcp-agent", features = ["openai-compat"] }
pmcp-package = { path = "../../../../../../mcp/sdk/rust-mcp-sdk/crates/pmcp-package" }
pmcp = { path = "../../../../../../mcp/sdk/rust-mcp-sdk", default-features = false }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
