[package]
name = "spike029-agent-loop"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (not a workspace member): this is a probe driver, built OUTSIDE the aprender workspace.
#
# THIS FILE IS A TEMPLATE. The three path dependencies below point at the sibling checkout
# ~/Development/mcp/sdk/rust-mcp-sdk, which carries whatever branch and local edits the developer
# has there, so a matrix cell must NOT be built from it. `make-variant.sh <variant> <sdk_dir>`
# rewrites the shared textual prefix to a chosen SDK tree and writes a generated directory with a
# real `Cargo.toml` under the gitignored deploy/llm-endpoint/.ids/ (cargo accepts --manifest-path
# only for a file literally named Cargo.toml, so a renamed copy beside this one cannot build).
[workspace]

[dependencies]
# pmcp.run's SDK agent loop and its OpenAI-compatible completion source: the real client, composed
# by path, never forked. The prefix "../../../../../../mcp/sdk/rust-mcp-sdk" is what make-variant.sh
# replaces; it is six levels up from this directory to ~/Development, then mcp/sdk/rust-mcp-sdk.
pmcp-agent = { path = "../../../../../../mcp/sdk/rust-mcp-sdk/crates/pmcp-agent", features = ["openai-compat"] }
pmcp-package = { path = "../../../../../../mcp/sdk/rust-mcp-sdk/crates/pmcp-package" }
pmcp = { path = "../../../../../../mcp/sdk/rust-mcp-sdk", default-features = false }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
