# Deployment config for the thin SetFit MCP server (pmcp.run).
# Deploy with:
#   APRENDER_SETFIT_MODEL=/abs/path/to/model.apr \
#     cargo pmcp deploy --target-type pmcp-run --target <named-target> \
#       --manifest-path crates/aprender-mcp-setfit-lambda
# The named target (~/.pmcp/config.toml) supplies the account/region binding.

[target]
type = "pmcp-run"
version = "1.0.0"

[aws]
region = "us-east-1"

[server]
name = "aprender-setfit-predict"
# The 22M-param MiniLM encoder plus a 256-text batch's activations need real
# headroom; 512MB (the scaffold default) OOMs a full-batch classify.
memory_mb = 2048
timeout_seconds = 60

[environment]
RUST_LOG = "info"

[secrets]

[auth]
enabled = false
provider = "none"
callback_urls = []

[auth.dcr]
enabled = true
public_client_patterns = [
    "claude",
    "desktop",
    "cursor",
    "mcp-inspector",
    "chatgpt",
]
default_scopes = [
    "openid",
    "email",
    "mcp/read",
]
allowed_scopes = [
    "openid",
    "email",
    "profile",
    "mcp/read",
    "mcp/write",
]

[auth.scopes.custom]

[observability]
log_retention_days = 30
enable_xray = true
create_dashboard = true

[observability.alarms]
error_threshold = 10
latency_threshold_ms = 15000

[assets]
include = []
exclude = [
    "**/*.tmp",
    "**/.DS_Store",
]

[composition]
tier = "foundation"
allow_composition = true
internal_only = false
