contract: forecast-tool-boundary
metadata:
  version: 1.3.0
  created: '2026-09-06'
  author: PAIML Engineering
  kind: kernel
  description: >
    THE TOOL BOUNDARY both forecasting MCP servers are held to. One `forecast` tool, stateless
    (D-01: the request carries the series, the fit or the zero-shot forward runs inside the call,
    there is no fit -> artifact -> forecast round-trip), and ONE response shape shared by every
    server so a client switches models by switching ENDPOINT and nothing else (D-03: one model per
    server). This file pins the numbers and the rules; the Rust constants are asserted equal to it
    at test time via `test_support::constant_u64`, never duplicated as literals (D-15).

    REFUSE, NEVER DEFAULT (D-11). Every knob this boundary does not understand is a refusal that
    NAMES THE FIX, never a silent coercion: an unknown argument key, an unknown `freq`, `model`,
    `growth` or `seasonality_mode`, a malformed date, an out-of-range `interval_width`, a logistic
    request with no usable `cap`, a constant `y`, a horizon of 0 or past the maximum. A client that
    passes `freq: "H"` and receives a DAILY forecast has been lied to; a client that receives
    `unsupported freq "H": use D, W or MS` has been told exactly what to change. Every refusal is
    `pmcp::Error::validation` — the caller's fault stays the caller's fault, and an `internal` code
    on any of them is a defect, not a formatting preference.

    THE TWO SERVERS AND WHY THEIR BOUNDS DIFFER. `aprender-mcp-forecast` FITS (Prophet 1.4.0 port /
    NeuralProphet-lite): it needs at least 10 points to have something to fit and reaches 3 650
    periods ahead. `aprender-mcp-chronos` is ZERO-SHOT (Chronos-Bolt T5, no fit): 4 points are
    enough to form a context, `y` may carry nulls, and the horizon is capped at 1 024 with a gate
    at the model's NATIVE 64 steps — past 64 the model rolls its own forecast forward, so the
    caller must opt in with `allow_long_horizon` and the response carries a `warning` saying how
    many autoregressive rollouts produced it (D-13). Both sets of bounds live here so a client
    reading ONE file knows what either endpoint will accept.

    THE POOL (D-12), AND WHY ITS TWO CLAIMS ARE SPLIT. pmcp 2.19.3's streamable-HTTP router holds a
    single `Arc<tokio::sync::Mutex<Server>>` across the WHOLE tool future
    (`streamable_http_server.rs:2094` and `:2122`), so eight concurrent fits against one router
    measured 1.0x sequential — the fits serialise behind the router lock, not behind CPU. K
    independent routers behind a round-robin fallback (default 8) measured 3.9x. That gives two
    claims of DIFFERENT kinds and this contract keeps them apart: `pool_equality_under_load` is a
    CORRECTNESS claim (a response computed under load is bit-identical to the same response
    computed alone — falsified by a unit test, in CI, always), and `pool_speedup_host_gated` is a
    BENCHMARK claim (a wall-clock ratio — falsified by `just forecast-pool-ratio` on a release
    build, best-of-3, NEVER by a libtest assertion). REVIEW-06-04: with four Tokio workers, eight
    heterogeneous `spawn_blocking` fits and BLAS work, that ratio moves with CPU throttling and
    background load independently of router serialisation, so a hard `assert!(speedup >= 2.0)`
    inside the correctness suite is a flake that buys nothing the host-gated recipe does not buy
    honestly. The unit test PRINTS the ratio with its provenance and asserts only equality.

    EMPIRICAL COVERAGE, NOT NOMINAL (D-16). The fit server's `interval_width` defaults to 0.8, and
    the nominal 80% band covered 0.60 (Prophet) and 0.66 (NeuralProphet-lite) of held-out points
    across 17 rolling-origin windows. The tool description says so. A band that advertises 80% and
    delivers 60% is a measurement the caller is entitled to, not a footnote.
  references:
    - 'Model Context Protocol specification 2025-06-18, `tools/call` and `tools/list` (the JSON-RPC shapes every case in this contract is asserted through).'
    - 'pmcp 2.19.3 `src/server/streamable_http_server.rs:2094` and `:2122` — the single `Arc<tokio::sync::Mutex<Server>>` held across the whole tool future; the lock the router pool works around.'
    - '.claude/skills/spike-findings-aprender/references/forecast-mcp-thin-server.md (the validated thin-server blueprint: one tool, per-request seed, no shared fit state).'
    - '.claude/skills/spike-findings-aprender/sources/010-forecast-server-concurrency/RUN-OUTPUT.md (the measured 1.0x with one router, 3.9x with eight, 8/8 and 16/16 bit-identical responses).'
    - 'contracts/prophet-parity-v1.yaml and contracts/chronos-bolt-parity-v1.yaml — the numeric parity bars behind the two doors this boundary fronts.'

# Machine-readable mirror of the boundary numbers. Not part of the `Contract` struct (the
# parser drops unknown top-level keys), and deliberately so: these are read at test time by
# `test_support::constant_u64("forecast-tool-boundary-v1", ...)` so `types::MIN_POINTS`,
# `types::MAX_POINTS`, `types::MAX_HORIZON` and `chronos::CHRONOS_*` are ASSERTED EQUAL to
# this file rather than the file merely describing them (D-15).
constants:
  # aprender-mcp-forecast (fits: Prophet 1.4.0 port / NeuralProphet-lite)
  fit_min_points: 10
  fit_max_points: 20000
  fit_max_horizon: 3650
  # `fit_max_points` bounds how MANY points arrive; these bound the work each one can
  # BUY. Every entry below closed a request whose payload was inside the three bounds
  # above and whose cost was not: a span-based daily grid, and holiday windows that are
  # a per-request design-column multiplier.
  # The last two close the PRODUCT the four before them leave open: each of
  # fit_max_points, fit_max_horizon, fit_max_holiday_columns and fit_max_holiday_dates
  # is checked in isolation, so a request inside all four still bought
  # (20000 + 3650) x 1000 = 23 650 000 design feature cells and 1 000 000 holiday dates.
  # fit_max_holiday_design_cost bounds (points + horizon) x holiday_columns across
  # make_design AND predict; fit_max_holiday_dates_total bounds sum(len(dates)).
  fit_max_span_days: 20000
  fit_max_holiday_window: 365
  fit_max_holiday_columns: 1000
  fit_max_holiday_dates: 1000
  fit_max_holiday_design_cost: 50000
  fit_max_holiday_dates_total: 10000
  # The ONE caller-settable field that had NO enforcement of any kind at the close of
  # 06-14 (door_surface.knobs, field: name, enforced_by: NOTHING) — found by that plan's
  # enumeration and by no review finding. prophet::columns turns ONE payload occurrence of
  # holidays[].name into TWO owned Strings per design column (the column name and the
  # component), then makes it the sort key of an O(C log C) byte-wise comparison sort, and
  # predict's component-name dedup compares it again. At fit_max_holiday_columns (1 000)
  # that is ~2 000 derived copies plus ~10 000 comparisons from a single occurrence — a
  # ~2 000:1 amplification. BYTES, because bytes are what the clone and the comparison cost.
  # 200 against a committed maximum of 9 ("superbowl", Prophet 1.4.0's own peyton_holidays).
  # There is no structural maximum to measure instead: neither transport caps the body.
  # Mirrored by types::MAX_HOLIDAY_NAME_LEN via types::tests::cost_bounds_match_contract.
  fit_max_holiday_name_len: 200
  # The Poisson mean the LOGISTIC uncertainty simulation draws on each of its 1 000 rows:
  # lambda = changepoint_count(len(ds)) x (t_max - 1), t_max = future_span_days /
  # history_span_days. fit_max_points, fit_max_span_days and fit_max_horizon are each
  # satisfied by a request whose RATIO is not, and fit_max_horizon bounds the COUNT of
  # future steps while dates::future_days multiplies that count by 7 for "W" and ~30.44 for
  # "MS" — so three isolated bounds left this product open. The structural maximum is
  # 86 789.8 (33 daily points, horizon 3650, freq MS), which is exactly the 1 132-byte
  # request 06-REVIEW.md CR-01 measured at 2.334 s against SC1's 2 s bar. Mirrored by
  # types::MAX_LOGISTIC_CHANGEPOINT_LAMBDA via test_support::constant_f64.
  fit_max_logistic_changepoint_lambda: 20000
  # The EXACT/APPROXIMATE branch point of prophet::poisson: at or below this mean the draw
  # takes Knuth's product method, above it a normal approximation with mean and variance both
  # exactly lambda. It decides which algorithm a caller's request gets, so it is behavioural
  # and belongs here rather than only in Rust (WR-01) — prophet::POISSON_NORMAL_BRANCH_LAMBDA
  # is its mirror, asserted by types::tests::cost_bounds_match_contract via constant_f64.
  # Not a COST ceiling: it selects an algorithm, it does not bound an amount of work.
  poisson_normal_branch_lambda: 30
  # aprender-mcp-chronos (zero-shot: Chronos-Bolt T5, no fit)
  chronos_min_points: 4
  chronos_max_points: 20000
  chronos_max_horizon: 1024
  chronos_native_horizon: 64
  # Shared defaults
  default_seed: 42
  default_interval_width_x100: 80
  # Router pool (D-12)
  pool_default: 8
  concurrency_requests: 8
  # 2.0x, expressed x10 because `constant_u64` reads integers. Asserted by
  # `just forecast-pool-ratio` on the aarch64 release host, NEVER by a unit test.
  pool_speedup_min_x10: 20
  pool_speedup_best_of: 3

# THE DOOR'S WHOLE SURFACE, ENUMERATED BY INSPECTION AND CHECKED BY TEST.
#
# Same shape and same reason as `constants:` above — not part of the `Contract` struct (the
# parser drops unknown top-level keys), and deliberately so: this block is READ AT TEST TIME
# by `types::tests::every_request_knob_is_enumerated` and
# `types::tests::every_cost_axis_names_a_real_bound`, so it is a CHECKED claim about the code
# rather than a document that describes it.
#
# WHY IT EXISTS. Three consecutive gap-closure rounds each closed exactly the ONE measured
# probe an adversarial pass had found, and each time the next pass found the next instance of
# the same class: "the door accepts a request whose cost or whose semantics it never checks".
# 06-11 closed the holiday design PRODUCT, 06-12 proved it through the transport, 06-13 fixed
# the sampler — and 06-13's own correct fix un-bounded the simulated changepoint count, which
# is CR-01. A fourth point fix would be a fourth round of the same mistake. The enumeration is
# the structural answer: `knobs:` is checked against `schemars::schema_for!` output in BOTH
# directions, so a field added to `ForecastArgs` or `HolidayArg` with no entry here turns a
# test red, and an entry here for a field that no longer exists turns the same test red.
#
# `cost_axes[].bound` must be one of: a key that exists in `constants:` above; the literal
# `measured_at_structural_maximum`, which additionally requires a `measured_seconds` strictly
# below 2.0 (SC1's bar); or the pending marker `unbounded_pending_06_15`. Pending entries are
# OUT OF SCOPE for `every_cost_axis_names_a_real_bound` and are the thing
# `types::tests::no_cost_axis_is_pending` fails on — see that test's doc comment.
door_surface:

  # ---- (a) every caller-settable field reachable through `aprender_forecast::forecast` ----
  # 12 `ForecastArgs` fields + 4 `HolidayArg` fields = 16. Derived from
  # `schemars::schema_for!`, never hand-kept: the test walks `schema["properties"]` for both
  # structs and asserts SET EQUALITY against the `field` + `owner` pairs below.
  knobs:
    - field: ds
      owner: ForecastArgs
      arms: 'both models, all three growth arms'
      enforced_by: 'len(ds) == len(y); fit_min_points <= len(ds) <= fit_max_points; parse_date per entry (ten ASCII bytes + calendar round trip); strictly ascending with no duplicates; (last - first + 1) <= fit_max_span_days'
    - field: y
      owner: ForecastArgs
      arms: 'both models'
      enforced_by: 'length tied to ds; every value finite; min(y) != max(y) (a constant series is refused before any design is built)'
    - field: horizon
      owner: ForecastArgs
      arms: 'both models'
      enforced_by: '1 <= horizon <= fit_max_horizon. This bounds the COUNT of future steps ONLY; the SPAN those steps cover is cost axis C-05 and is a function of freq'
    - field: freq
      owner: ForecastArgs
      arms: 'prophet (via dates::future_days); neuralprophet refuses anything but "D"'
      enforced_by: 'closed allowlist {D, W, MS}, refused by name otherwise; neuralprophet narrows it to {D}. Enforced as an ENUM — its COST effect is the 1 / 7 / ~30.44 day-span multiplier of C-05, which feeds C-06'
    - field: model
      owner: ForecastArgs
      arms: 'dispatch'
      enforced_by: 'closed allowlist {prophet, neuralprophet}, refused by name otherwise; default prophet'
    - field: growth
      owner: ForecastArgs
      arms: 'prophet only (refused on the neuralprophet arm)'
      enforced_by: 'closed allowlist {linear, logistic, flat}, refused by name otherwise; default linear. Selects which of C-06 / C-09 the request pays'
    - field: cap
      owner: ForecastArgs
      arms: 'prophet, logistic growth only'
      enforced_by: 'logistic-only (06-10: refused on linear, flat AND the defaulted arm); must be finite; must exceed max(y). The Spec-borne value is bound inside the logistic branch (checked_cap), so a Spec carrying an unvalidated cap is unreachable'
    - field: seasonality_mode
      owner: ForecastArgs
      arms: 'prophet only'
      enforced_by: 'closed allowlist {additive, multiplicative}, refused by name otherwise; default additive'
    - field: interval_width
      owner: ForecastArgs
      arms: 'both models'
      enforced_by: 'strictly inside the open interval (0, 1); default default_interval_width_x100 / 100. No cost axis — it selects two percentiles from a simulation whose size it does not change'
    - field: holidays
      owner: ForecastArgs
      arms: 'prophet only (refused on the neuralprophet arm)'
      enforced_by: 'per-holiday windows, dates and column count (see the HolidayArg entries below), then the aggregate fit_max_holiday_columns, fit_max_holiday_dates_total and fit_max_holiday_design_cost product bounds'
    - field: n_lags
      owner: ForecastArgs
      arms: 'neuralprophet only (refused on the prophet arm)'
      enforced_by: 'n_lags <= 365 and n_lags < n_train_grid. Enforced as a RANGE — its COST effect is C-08, which has no budget of any kind on its path'
    - field: seed
      owner: ForecastArgs
      arms: 'both models'
      enforced_by: 'any u64 is legal by construction; default default_seed. No cost axis — the seed selects an RNG stream, not an amount of work. It is the mechanism behind pool_equality_under_load'
    - field: name
      owner: HolidayArg
      arms: 'prophet only'
      enforced_by: 'len(name) in BYTES <= fit_max_holiday_name_len, refused FIRST in the holiday loop (06-15 T2). Before that it was enforced by NOTHING: an arbitrary-length String, cloned TWICE per design column by prophet::columns (as `name` and as `component`), used as the sort key of hcols.sort_by, and compared again per column by predict''s component-name dedup. Cost axis C-07'
    - field: dates
      owner: HolidayArg
      arms: 'prophet only'
      enforced_by: 'len(dates) <= fit_max_holiday_dates per holiday; the running sum is refused against fit_max_holiday_dates_total INSIDE the loop (WR-03 closed by 06-15 T1), with the post-loop check kept because only it has seen every holiday and can report the request''s EXACT total; parse_date per entry, now only for holidays the door has not already refused'
    - field: lower_window
      owner: HolidayArg
      arms: 'prophet only'
      enforced_by: 'must be <= 0 and >= -fit_max_holiday_window; contributes (upper - lower + 1) to the running column count, refused past fit_max_holiday_columns'
    - field: upper_window
      owner: HolidayArg
      arms: 'prophet only'
      enforced_by: 'must be >= 0 and <= fit_max_holiday_window; contributes (upper - lower + 1) to the running column count, refused past fit_max_holiday_columns'

  # ---- (b) every cost axis whose magnitude is a function of caller input ----
  # `spent_outside_fit_budget` is the column that matters. `fit::FIT_BUDGET_SECS` is entered
  # INSIDE `fit::fit_prophet`; `make_design` runs before it and `predict` runs after it, which
  # is the STRUCTURAL reason 13 of these 14 axes are outside it and why every bound this phase
  # has added had to go at the door. Exactly ONE axis is inside.
  cost_axes:
    - axis: C-01
      name: 'history date parse'
      formula: 'len(ds)'
      spent_in: 'forecast::forecast, the parse_date loop'
      spent_outside_fit_budget: true
      bound: fit_max_points
      checked_at: 'the door, before any date is parsed'
    - axis: C-02
      name: 'NeuralProphet imputed daily grid'
      formula: 'span_days = ds.last - ds.first + 1'
      spent_in: 'np::NpData::new'
      spent_outside_fit_budget: true
      bound: fit_max_span_days
      checked_at: 'the door, before the model arms are entered'
    - axis: C-03
      name: 'holiday date parse and membership sets'
      formula: 'sum(len(h.dates))'
      spent_in: 'forecast::forecast holiday loop, then prophet::holiday_day_sets'
      spent_outside_fit_budget: true
      bound: fit_max_holiday_dates_total
      checked_at: 'the door, INSIDE the holiday loop the moment the running sum passes the ceiling (WR-03 closed by 06-15 T1), with the post-loop exact-total refusal retained'
    - axis: C-04
      name: 'holiday design feature cells'
      formula: '(len(ds) + horizon) * holiday_columns'
      spent_in: 'prophet::make_design (points rows) and prophet::predict (horizon rows)'
      spent_outside_fit_budget: true
      bound: fit_max_holiday_design_cost
      checked_at: 'the door, before make_design (06-11)'
      note: 'predict additionally runs comp_of ONCE PER DISTINCT COMPONENT NAME, so the cells are re-swept (1 + distinct_components) times. distinct_components <= fit_max_holiday_columns, so the product stays bounded (<= 5e7 float ops at the ceiling) — but the multiplier was not part of this bound''s original derivation and is recorded here rather than left implicit.'
    - axis: C-05
      name: 'future grid span in days'
      formula: 'horizon * freq_step, where freq_step is 1 (D), 7 (W) or ~30.44 (MS)'
      spent_in: 'dates::future_days, then as t_max in prophet::predict'
      spent_outside_fit_budget: true
      bound: fit_max_horizon
      checked_at: 'the door, as a COUNT only'
      note: 'The allocation itself is len(fut) == horizon and is bounded by fit_max_horizon. What fit_max_horizon does NOT bound is the SPAN that count buys — 30.44x more days on "MS" than on "D" for the same legal horizon. That span is t_max, and its only cost consumer is C-06, bounded by fit_max_logistic_changepoint_lambda since 06-14. This axis is the reason that bound is on the PRODUCT and not on the horizon.'
    - axis: C-06
      name: 'logistic simulated changepoints'
      formula: 'uncertainty_samples * changepoint_count(len(ds)) * (t_max - 1)'
      spent_in: 'prophet::predict, the Growth::Logistic uncertainty arm'
      spent_outside_fit_budget: true
      bound: fit_max_logistic_changepoint_lambda
      checked_at: 'the door, after Spec assembly and before make_design (06-14)'
      note: '06-REVIEW.md CR-01. uncertainty_samples (1 000) is a Spec field, NOT a ForecastArgs field — it is a fixed multiplier here, not a knob.'
    - axis: C-07
      name: 'holiday column name bytes'
      formula: 'holiday_columns * 2 * len(name), plus an O(C log C) string sort and predict''s O(C * distinct_components) name dedup'
      spent_in: 'prophet::columns and prophet::predict''s component-name dedup'
      spent_outside_fit_budget: true
      bound: fit_max_holiday_name_len
      checked_at: 'the door, FIRST in the holiday loop, before the name is cloned into any Column (06-15)'
      note: 'CLOSED BY A BOUND, never by a measurement. 06-14 shipped this axis with no_structural_maximum: true because holidays[].name is an unbounded String with no structural maximum to measure: crates/aprender-mcp-forecast/src/lib.rs''s router construction (http_app / pooled_app) applies no DefaultBodyLimit, no max_body and no content-length layer, and the stdio transport has no framing cap at all — so any measured_seconds would have described an arbitrarily CHOSEN name length rather than a maximum. 1 000 columns x an N-byte name is a ~2 000:1 amplification off one payload occurrence; at the bound that is ~400 KB of String and ~10 000 comparisons of <= 200 bytes. The bound is on BYTES because bytes are what the clone and the byte-wise comparison cost. The check is FIRST in the loop, which also bounds every other refusal message in that loop — each formats h.name back to the caller.'
    - axis: C-08
      name: 'NeuralProphet training work'
      formula: 'n_lrs * epochs * n_samples * (n_lags + 1), with n_lrs in {2, 3}, epochs = auto_epochs(n) <= 500 (or <= 320 with lags) and n_samples <= n_train_grid'
      spent_in: 'np::train'
      spent_outside_fit_budget: true
      bound: unbounded_pending_06_15
      checked_at: 'NOWHERE — this axis is OPEN'
      note: 'There is no budget of ANY kind on this path: FIT_BUDGET_SECS lives in fit::fit_prophet, which the neuralprophet arm never enters. Every factor is individually bounded (n_lags <= 365, n_samples <= fit_max_span_days, epochs <= 500) but their product is not, and the lr sweep multiplies the whole thing by 2 or 3.'
      owed_by: '06-15 T3'
    - axis: C-09
      name: 'linear / flat uncertainty simulation'
      formula: 'uncertainty_samples * n_future'
      spent_in: 'prophet::predict, the Growth::Linear arm'
      spent_outside_fit_budget: true
      bound: fit_max_horizon
      checked_at: 'the door, as the horizon count'
      note: 'Linear in n_future with no t_max amplification, which is why 06-REVIEW.md measured this arm FLAT at 0.149 s across the same geometries where the logistic arm went to 2.334 s.'
    - axis: C-10
      name: 'percentile sorts over the simulation'
      formula: 'n_rows * uncertainty_samples * log(uncertainty_samples)'
      spent_in: 'prophet::predict, the band assembly'
      spent_outside_fit_budget: true
      bound: fit_max_horizon
      checked_at: 'the door, as the horizon count'
    - axis: C-11
      name: 'seasonality design cells'
      formula: '(len(ds) + horizon) * seasonality_columns, seasonality_columns <= 34'
      spent_in: 'prophet::make_design and prophet::predict'
      spent_outside_fit_budget: true
      bound: fit_max_points
      checked_at: 'the door, as the point count'
      note: 'auto_seasonalities is NOT caller-settable: the ceiling of 34 columns (yearly order 10, weekly 3, daily 4, x2 for the sin/cos pair) is a property of the code, not of the request. Recorded as a fixed multiplier rather than as a knob.'
    - axis: C-12
      name: 'NeuralProphet recursive AR predict'
      formula: 'horizon * n_lags'
      spent_in: 'np::predict_ar_recursive'
      spent_outside_fit_budget: true
      bound: fit_max_horizon
      checked_at: 'the door (horizon), plus n_lags <= 365'
    - axis: C-13
      name: 'response serialization'
      formula: 'horizon * (5 + n_components)'
      spent_in: 'forecast::forecast, building the ForecastResponse'
      spent_outside_fit_budget: true
      bound: fit_max_horizon
      checked_at: 'the door, as the horizon count'
    - axis: C-14
      name: 'L-BFGS MAP fit'
      formula: 'iterations * rows * K'
      spent_in: 'fit::fit_prophet'
      spent_outside_fit_budget: false
      bound: fit_max_points
      checked_at: 'inside the fit, by MAX_ITERS_PER_ROUND and the cooperative FIT_BUDGET_SECS round-boundary budget'
      note: 'The ONLY axis inside the budget. It is also the only one FIT_BUDGET_SECS could ever have covered, which is the structural fact behind every door bound this phase has added — and the budget is COOPERATIVE, so it overshoots by up to one full round (a 20 000-point / 1 000-column request measured 70.089 s against a 15 s budget).'

equations:

  fit_server_bounds:
    formula: 'accept(args) requires fit_min_points <= len(ds) <= fit_max_points AND len(ds) == len(y) AND 1 <= horizon <= fit_max_horizon'
    domain: 'untrusted JSON-RPC `tools/call` arguments to `aprender-mcp-forecast`'
    codomain: 'either a ForecastResponse or a pmcp::Error::validation naming the violated bound and the observed value'
    invariants:
      - 'the Rust constants are asserted EQUAL to constants.fit_min_points / fit_max_points / fit_max_horizon by types::tests::bounds_match_contract — the contract is the source, the code is the mirror'
      - 'a length mismatch is refused with "ds has N entries but y has M" BEFORE any bound is checked, so the caller learns the shape error rather than a derived one'
      - 'these bounds are the HARD ceiling on the work one request can buy (T-06-02); FIT_BUDGET_SECS is a cooperative round-boundary budget and is NOT a cap (REVIEW-06-U1)'
      - 'horizon 0 and horizon fit_max_horizon+1 are both refused by the same message "horizon must be 1..=3650, got N"'
    preconditions:
      - 'the arguments deserialized, i.e. every key was known (see unknown_field_refused)'

  # The completion of fit_server_bounds' third invariant: that entry CLAIMS a HARD
  # ceiling on the work one request can buy, and until this equation existed the claim
  # rested on four bounds checked in ISOLATION whose PRODUCT was unbounded.
  holiday_design_cost_bounded:
    formula: 'accept(args) requires (len(ds) + horizon) * holiday_columns(args) <= fit_max_holiday_design_cost AND sum(len(h.dates) for h in args.holidays) <= fit_max_holiday_dates_total, where holiday_columns(args) = sum(h.upper_window - h.lower_window + 1)'
    domain: 'the holidays argument of the fit server together with len(ds) and horizon — untrusted, unauthenticated JSON-RPC `tools/call` input'
    codomain: 'either a design build (make_design, then the L-BFGS fit) or a validation refusal naming the OBSERVED cost, how it was computed, the bound it exceeded, and which of the holiday windows / holiday count / history length / horizon to reduce'
    invariants:
      - 'the Rust constants are asserted EQUAL to constants.fit_max_holiday_design_cost and constants.fit_max_holiday_dates_total by types::tests::cost_bounds_match_contract — the contract is the source, the code is the mirror'
      - 'the check runs BEFORE make_design, which is the only place it CAN run: FIT_BUDGET_SECS is a cooperative ROUND-BOUNDARY budget entered inside fit_prophet, and the design build happens before that — so no setting of FIT_BUDGET_SECS could ever have seen this cost. It also overshoots inside the fit: a 20 000-point / 1 000-column request measured 70.089 s against a 15 s budget'
      - 'the MEASURED breach this closes: 3 000 points x 181 holiday columns x 84 holiday dates walled at 16.113 s against SC1 s 2 s bar (reproduced at 16.081 s on the aarch64 release host at HEAD ce3e5a8ea), with 2 000 x 121 x 84 at 8.926 s and 1 000 x 61 x 84 at 2.664 s; the in-bounds maximum extrapolates to roughly 85 minutes for ONE request against a default pool of K=8 (constants.pool_default)'
      - 'fit_max_points, fit_max_holiday_columns and fit_max_holiday_dates each remain enforced ON THEIR OWN — this equation bounds their COMPOSITION, so an accepted request satisfies all of them AND this'
      - 'the bounded statistic is (points + horizon) x holiday_columns — the DESIGN CELL COUNT, not the literal points x columns x dates triple — because the triple cannot separate the shapes: 20 000 x 1 000 x 2 (triple 4.00e7, cells 2.04e7) walls at 70.089 s while 3 000 x 181 x 84 (triple 4.56e7, the LARGER, cells 6.09e5) walls at 16.216 s, so no single threshold on the triple both refuses the 70 s request and accepts the cheap ones. The wall is monotone in cells, not in the triple. The third factor is closed additively by fit_max_holiday_dates_total instead'
      - 'this bounds WORK, not WALL, and says so: the L-BFGS iteration count is data-dependent, so a 25 000-cell request (half the bound) reproducibly walls at 4.2 s. The arithmetic ceiling per iteration is what is guaranteed; the residual wall-clock exposure is FIT_BUDGET_SECS, a separate knob'
    preconditions:
      - 'every per-holiday bound has already fired with its own message, so holiday_columns <= fit_max_holiday_columns and each len(h.dates) <= fit_max_holiday_dates — what remains unchecked is only what they multiply and sum to'

  # The THIRD instance of door_surface_is_complete, and the only bound in this file whose
  # subject is a STRING rather than a count: the one caller-settable field the enumeration
  # found with `enforced_by: NOTHING`, which no review finding had pointed at.
  holiday_name_cost_bounded:
    formula: 'accept(args) requires forall h in args.holidays: len_bytes(h.name) <= fit_max_holiday_name_len'
    domain: 'the name field of every element of the holidays argument of the fit server — untrusted, unauthenticated JSON-RPC `tools/call` input, an arbitrary-length String on both transports'
    codomain: 'either a design build, or a validation refusal naming the holiday''s INDEX, the OBSERVED byte length, the bound key max_holiday_name_len and its value — and never the name itself'
    invariants:
      - 'the Rust constant is asserted EQUAL to constants.fit_max_holiday_name_len by types::tests::cost_bounds_match_contract — the contract is the source, the code is the mirror (D-15). OBSERVED RED by changing the YAML value ALONE and observing the test fail naming the key'
      - 'the bound is on BYTES, and that is load-bearing rather than incidental: String::len is bytes, and bytes are exactly what the two clones per column and the byte-wise sort comparison cost. forecast::tests::a_holiday_name_whose_char_count_fits_but_whose_byte_length_does_not_is_refused sends 101 multi-byte characters (101 chars, under the bound; 202 bytes, over it) and is the ONLY test in the suite that a rewrite to chars().count() turns red'
      - 'the AMPLIFICATION this bounds: prophet::columns turns ONE payload occurrence of the name into TWO owned Strings per design column — the column name (format!("{}_delim_{}{}", h.name, sign, off)) and the component (h.name.clone()) — then makes it the key of hcols.sort_by, an O(C log C) byte-wise comparison sort; prophet::predict''s component-name dedup compares it again O(C * distinct_components) times; and it reaches the serialized reply as a key of the components map. At fit_max_holiday_columns (1 000) that is ~2 000 copies plus ~10 000 comparisons, each LINEAR in the length — ~2 000:1'
      - 'this axis had NO structural maximum, so measured_at_structural_maximum was never an available disposition and only a bound could close it: neither transport caps the request body (no DefaultBodyLimit, no max_body, no content-length layer on http_app / pooled_app; no framing cap on stdio). Any wall written for it would have measured an arbitrarily CHOSEN length. That is why 06-14 held it open with a red test rather than measuring it'
      - 'the VALUE is derived from what is COMMITTED: the longest holiday name in any fixture, example or test in this repository is 9 bytes — "superbowl", from Prophet 1.4.0''s own canonical peyton_holidays frame, whose other label is "playoff" (7 bytes). 200 is 22x that and two orders of magnitude past any human label, bounding the worst case at 1 000 x 2 x 200 = ~400 KB of String. The same arithmetic on the UNBOUNDED field with a 1 MB name — which nothing at HEAD refused — is ~2 GB from a single request'
      - 'the refusal names the POSITION and the LENGTH and NEVER the name (T-06-38): echoing an oversized string back re-materialises the very bytes the bound refuses and reflects attacker-controlled content into logs. OBSERVED RED through the live streamable-HTTP router: with the constant and the contract key raised, the server ACCEPTED a 201-byte name and returned a full-shape forecast whose components map carried that name as a key; restored, the same request is refused'
      - 'the check is FIRST in the holiday loop, before the name is cloned into any Column — which additionally bounds every OTHER refusal message in that loop, each of which formats h.name back to the caller'
      - 'the bound is ONE-SIDED by design. An empty name is a separate question this plan does not open, and forecast::tests::an_empty_holiday_name_is_not_refused_by_the_length_bound pins that so a later "tidy-up" cannot answer it by accident'
    preconditions:
      - 'args deserialized under deny_unknown_fields, so holidays is a well-formed array of HolidayArg; nothing about the name has been read yet, which is why this check can be first'

  # The second completion of fit_server_bounds' third invariant, and the FIRST instance of
  # door_surface_is_complete below: the bound's existence is derivable from the door_surface
  # entry for cost axis C-06 rather than being a standalone patch.
  logistic_changepoint_cost_bounded:
    formula: 'accept(args) requires args.growth != logistic OR changepoint_count(len(args.ds)) * (t_max(args) - 1) <= fit_max_logistic_changepoint_lambda, where t_max(args) = (last(future_days(freq, horizon, last(ds))) - first(ds)) / (last(ds) - first(ds))'
    domain: 'the growth / freq / horizon arguments of the fit server together with the SPACING of ds — untrusted, unauthenticated JSON-RPC `tools/call` input'
    codomain: 'either a forecast, or a validation refusal naming the OBSERVED Poisson mean, BOTH factors that produced it (the changepoint count and t_max, with the two spans t_max is a ratio of), the bound key max_logistic_changepoint_lambda and its value, and three concrete fixes — shorten the horizon, use freq "D" instead of "W" or "MS", or send a longer history'
    invariants:
      - 'the Rust constant is asserted EQUAL to constants.fit_max_logistic_changepoint_lambda by types::tests::cost_bounds_match_contract through test_support::constant_f64 — the contract is the source, the code the mirror (D-15). It is an f64 because lambda is one, which is why constant_f64 exists'
      - 'the check runs BEFORE make_design, and it could NOT have been a FIT_BUDGET_SECS setting: that budget is entered inside fit::fit_prophet, and this cost is spent in prophet::predict, which forecast::forecast calls AFTER the fit returns with no budget of any kind. 13 of the 14 axes enumerated in door_surface.cost_axes are outside that budget, which is the structural fact behind every door bound this phase has added'
      - 'fit_max_horizon bounds the COUNT of future steps while dates::future_days multiplies that count by 7 for "W" and ~30.44 for "MS", and fit_max_points / fit_max_span_days bound the HISTORY independently — so three isolated bounds left this RATIO open. A high-lambda request is necessarily a SHORT-history request, which is exactly why every headline bound is satisfied while the product is not'
      - 'the pre-06-13 saturation near 745.13 was an ACCIDENTAL cap, not a bound: Knuth''s product method compares against exp(-lambda), which is exactly 0.0 above lambda 745.13, so the loop could only end on subnormal underflow. Removing it was CORRECT (the sampler now tracks lambda across its whole domain) and this bound is its REPLACEMENT — not a re-clamp. Clamping inside prophet::poisson is prohibited: it would remove the wall and silently reintroduce the truncation 06-13 exists to delete'
      - 'the door and the sampler cannot disagree about the changepoint count: prophet::changepoint_count is the single implementation, make_design is tied to it by a debug_assert and by prophet::changepoints::changepoint_count_equals_the_design_it_describes (a sweep over n and n_changepoints), and the door calls the same function. A bound computed from a second inline copy of that arithmetic would be evadable at any point count where the two drifted'
      - 'the VALUE is derived from measurement, not chosen: three at-the-bound compositions at the tightest legal history span (33 daily points) on a release build — freq D horizon 3650 (lambda 2 851.6) 0.244 s, freq W horizon 3650 (lambda 19 960.9) 0.711 s, freq MS horizon 840 (lambda 19 974.2) 0.582 s — all under SC1''s 2 s bar, worst case 2.8x headroom. freq D cannot reach this bound at all: 2 851.6 is its OWN structural maximum at 33 points'
      - 'the structural maximum of the axis is 86 790 (33 daily points, horizon 3650, freq MS) and it is EXACTLY the review''s measured request. OBSERVED RED through the live streamable-HTTP router: with the constant and the contract key raised to 200 000, the server ACCEPTED that request and returned a full-shape forecast, walling at 2.579 s; restored to 20 000, the same request is refused'
    preconditions:
      - 'the growth enum has been parsed and the logistic cap rules have already fired with their own messages, and ds is strictly ascending with len >= fit_min_points — so the history span is strictly positive and t_max needs no division guard'

  # The equation the OTHER equations in this file are instances of. Every bound above closes
  # one axis; this one says the SET of axes and the SET of knobs are both accounted for.
  door_surface_is_complete:
    formula: 'knobs(door_surface) == properties(schema_for!(ForecastArgs)) union properties(schema_for!(HolidayArg)) AND forall a in cost_axes(door_surface): a.bound in keys(constants) or (a.bound == measured_at_structural_maximum and a.measured_seconds < 2.0) or a.bound matches unbounded_pending_*'
    domain: 'the enumeration in this file''s door_surface block, against the Rust structs and constants it claims to describe'
    codomain: 'green, or a named field / named axis on one side of a symmetric difference'
    invariants:
      - 'WHY THIS EXISTS, and it is a measured history rather than a principle: three consecutive gap-closure rounds each closed exactly the ONE probe an adversarial pass had measured, and each time the next pass found the next instance of the same class — "the door accepts a request whose cost or whose semantics it never checks". 06-11 closed the holiday design PRODUCT, 06-12 proved it through the transport, 06-13 corrected the Poisson sampler, and 06-13''s own correct fix un-bounded the simulated changepoint count (CR-01). A fourth point fix would be a fourth round of the same mistake, so the door''s WHOLE surface is enumerated and the enumeration is machine-checked.'
      - 'the knob list is derived from schemars::schema_for! — the SAME generator that produces the advertised MCP tool schema — never from a hand-kept copy, so it cannot silently fall behind the struct. A hand-kept list is exactly the aspirational invariant this equation replaces'
      - 'BOTH directions are checked, because a one-directional check lets the list rot in the other one. MISSING (a field exists with no entry) is how CR-01''s cost axis got in; PHANTOM (an entry for a field that exists on neither struct) is how an enumeration silently stops describing the code while still looking complete. Both were OBSERVED RED by mutation, not merely asserted'
      - 'the cost-axis check is SPLIT IN TWO on purpose. every_cost_axis_names_a_real_bound validates only the NON-pending entries and is GREEN, so a regression toward a phantom bound key is visible; no_cost_axis_is_pending asserts the pending set is empty and SHIPS RED from the close of plan 06-14 until 06-15 replaces C-07''s and C-08''s markers with real bounds. A plan whose thesis is that a guard which cannot fail is theater must not make its own open items invisible'
      - 'C-07 (holidays[].name byte amplification) can be closed ONLY by a bound, never by a measurement: the field is an unbounded String, the router construction in crates/aprender-mcp-forecast/src/lib.rs applies no DefaultBodyLimit / max_body / content-length layer, and the stdio transport has no framing cap — so it has NO structural maximum and any measured_seconds for it would measure an arbitrarily CHOSEN length. Its entry carries no_structural_maximum: true recording that measured_at_structural_maximum is not an available disposition for it'
      - '13 of the 14 enumerated cost axes are spent OUTSIDE fit::FIT_BUDGET_SECS. That is the structural fact behind every door bound this phase has added: the budget is entered inside fit::fit_prophet, make_design runs before it and predict runs after it, so no setting of it could ever have seen those costs'
    preconditions:
      - 'the door_surface block is present and parseable; pv drops it as an unknown top-level key exactly as it drops constants:, so it is read at TEST time rather than by the contract engine'

  chronos_server_bounds:
    formula: 'accept(args) requires chronos_min_points <= len(ds) <= chronos_max_points AND len(ds) == len(y) AND 1 <= horizon <= chronos_max_horizon AND at least 2 non-null y'
    domain: 'untrusted JSON-RPC `tools/call` arguments to `aprender-mcp-chronos`'
    codomain: 'either a ChronosResponse or a pmcp::Error::validation naming the violated bound'
    invariants:
      - 'the Rust constants are asserted EQUAL to constants.chronos_min_points / chronos_max_points / chronos_max_horizon by types::tests::chronos_bounds_match_contract'
      - 'the floor is 4, not 10: Chronos is ZERO-SHOT, so four points are a context, not a training set'
      - 'y is Vec<Option<f64>> here — nulls are legal context gaps, but fewer than 2 observed values is refused with "y needs at least 2 observed (non-null) values"'
      - 'chronos::validate is a weights-FREE seam (D-18), so every refusal above is asserted on an unarmed run with no model directory present'

  date_validity:
    formula: 'ds parses as YYYY-MM-DD, every entry is a real calendar date, and ds is strictly ascending with no duplicates'
    domain: 'the ds array of either server'
    codomain: 'Vec<i64> days since 1970-01-01, or a validation refusal'
    invariants:
      - 'an impossible date such as "2008-02-30" is refused by a civil-date ROUND TRIP (days_from_civil then civil_from_days must return the same fields), with the message "not a calendar date" — never by a hardcoded month-length table'
      - 'unsorted and duplicate ds share one refusal, "ds must be strictly ascending with no duplicates", because both break the same downstream assumption'
      - 'D-17: no calendar library is a dependency of any Phase 6 crate; dates are i64 day counts'
    preconditions:
      - 'date_shape_exactly_ten_ascii_bytes holds for every entry — the shape is checked before any field is read'

  date_shape_exactly_ten_ascii_bytes:
    formula: 'parse_date(s) requires len(s) == 10 AND s.is_ascii() AND s[4] == "-" AND s[7] == "-" AND the other eight bytes are ASCII digits'
    domain: 'any string offered as a ds entry or a holiday date'
    codomain: 'i64 days, or a validation refusal naming YYYY-MM-DD'
    invariants:
      - 'REVIEW-06-U2. The spike took a ten-byte PREFIX and never inspected what followed, so "2008-02-01garbage" and "2008-02-01T00:00:00" both parsed as 2008-02-01. That is defaulting, and D-11 forbids it at this boundary.'
      - 'four distinct malformed shapes are each their own e2e case: trailing content, empty string, surrounding whitespace, non-ASCII — all refused with a message containing YYYY-MM-DD'
      - 'the calendar round-trip message is UNCHANGED by this rule, so "2008-02-30" still refuses with "not a calendar date" rather than with the shape message'
      - 'every committed fixture and CSV carries a bare YYYY-MM-DD, so tightening the shape cannot move a parity number'

  freq_allowlist:
    formula: 'freq in {D, W, MS}; anything else is refused. Default is D.'
    domain: 'the optional freq argument of either server'
    codomain: 'the future date grid, or a validation refusal naming the allowed set'
    invariants:
      - 'H is refused BY NAME with "unsupported freq \"H\": use D, W or MS" — sub-daily steps were never spiked and a silent daily fallback would be a wrong answer, not a degraded one'
      - 'the allowlist is closed: a new frequency is a contract edit, visible to `pv diff`, never an inline match arm'
      - 'MS lands on the first of each month; W steps 7 days; D steps 1 day'
      - 'neuralprophet additionally supports D ONLY and refuses W/MS with "neuralprophet supports freq D only" — a narrower allowlist inside the wider one, still a refusal and still naming the fix'

  interval_width_open_unit:
    formula: '0 < interval_width < 1, default default_interval_width_x100 / 100 = 0.8'
    domain: 'the optional interval_width argument of the fit server'
    codomain: 'the band z-score, or a validation refusal'
    invariants:
      - 'the interval is OPEN at both ends: 0.0 and 1.0 are both refused with "interval_width must be in (0, 1)" — a 100% band is not a number this model can produce'
      - 'D-16: the band is reported at its MEASURED empirical coverage (0.60 Prophet, 0.66 NeuralProphet-lite over 17 rolling-origin windows), which the tool description states; the nominal width is an input, not a guarantee'

  logistic_requires_cap_above_max_y:
    formula: 'growth == logistic implies cap is present AND cap > max(y)'
    domain: 'the fit server growth / cap arguments'
    codomain: 'a logistic Prophet spec, or a validation refusal'
    invariants:
      - 'a missing cap is refused with "logistic growth needs cap"; a cap at or below max(y) with "cap C must exceed max(y) = M" — two distinct messages because they have two distinct fixes'
      - 'the check runs BEFORE the design is built, so a saturating logistic curve can never be fitted to data that already exceeds its own ceiling'

  cap_is_logistic_only:
    formula: 'cap is present implies growth == logistic; on any other growth arm the request is refused'
    domain: 'the fit server growth / cap arguments, including the DEFAULTED growth arm where no growth key is sent at all'
    codomain: 'a validation refusal "cap is logistic-only; set growth to \"logistic\""'
    preconditions:
      - 'model resolves to prophet — a cap aimed at the neuralprophet arm is already refused earlier with the cross-MODEL message "cap is prophet-only; set model to \"prophet\"", which this rule does not touch'
    invariants:
      - 'the message NAMES THE FIX ("set growth to \"logistic\"") rather than merely reporting that the input was wrong, which is the D-11 shape every refusal at this door takes'
      - 'the DEFAULTED arm is covered, not only the explicitly-linear one: a request carrying `cap` and no `growth` key is the shape a real caller hits, and a check keyed on the PRESENCE of `growth` would miss it — asserted by a separate case for exactly that reason'
      - 'the check runs AFTER the growth enum is parsed, so an unknown growth string still refuses first with its own message "growth \"exponential\": linear, logistic or flat"; the three logistic-arm messages ("logistic growth needs cap", "cap must be a finite number", "cap C must exceed max(y) = M") also keep their own distinct texts — four fixes, four messages, never one merged refusal'
      - 'it does not OVER-refuse: growth == logistic with a finite cap above max(y) still fits and returns a band, pinned by a positive control in the same unit test and by the e2e case prophet_logistic_with_holidays_happy_path'
      - 'STRUCTURAL, not merely guarded: the cap that reaches Spec is bound inside the logistic branch (`checked_cap`, set only after the finiteness and cap > max(y) checks pass), so a Spec carrying a cap the door did not validate is unreachable rather than merely unreached'
      - 'the MEASURED breach this closes, at HEAD ce3e5a8ea on gsd/phase-2-contract-gate: five probes — baseline-no-cap, linear+cap100, bare-cap100, linear+cap0.5 (BELOW max(y) = 28.9) and flat+cap100 — all returned yhat_max 35.8994 with a BYTE-IDENTICAL diagnostics object, while the two logistic controls refused; that is the refusal machinery existing and simply never being reached, and the caller had no way to discover their cap was dropped'
      - 'prophet::make_design matches only (Growth::Logistic, Some(c)) and falls to `_ => None` for every other pair, which is why a cap off the logistic arm was provably INERT rather than approximately honoured'

  constant_y_refused_before_fit:
    formula: 'min(y) != max(y), checked before any design is built or any optimiser is entered'
    domain: 'the y array of the fit server'
    codomain: 'a validation refusal "y is constant; nothing to fit (Prophet special-cases this too)"'
    invariants:
      - 'Prophet 1.4.0 special-cases this too; refusing is the honest form of the same decision'
      - 'the refusal is BEFORE the fit: a constant series would otherwise reach L-BFGS with a degenerate scale and burn the budget producing a meaningless answer'
      - 'non-finite y is refused by the neighbouring rule "y contains a non-finite value"'

  unknown_field_refused:
    formula: 'the advertised inputSchema carries additionalProperties == false, and deserialization refuses any key not in the schema'
    domain: 'the arguments object of a tools/call'
    codomain: 'a validation refusal naming the offending key'
    invariants:
      - 'the refusal is structural (serde deny_unknown_fields), not a hand-written key list that could drift from the struct'
      - 'the strictness is ADVERTISED: `tools/list` reports additionalProperties == false, so a client can see the rule before sending anything'
      - 'required is exactly {ds, y, horizon}; every other property is optional with a documented default'
      - 'a typo such as `horizen` is therefore a refusal that names `horizen`, never a request silently missing its horizon'

  unknown_enum_refused:
    formula: 'model in {prophet, neuralprophet}, growth in {linear, logistic, flat}, seasonality_mode in {additive, multiplicative}; anything else refuses'
    domain: 'the string-valued option arguments of the fit server'
    codomain: 'a validation refusal listing the accepted values'
    invariants:
      - 'each message ENDS with the accepted set — "model \"arima\": prophet or neuralprophet" — so the fix is in the refusal'
      - 'these are the D-11 cases most likely to be silently coerced by a permissive implementation, which is exactly why each has its own e2e case'
      - 'the None case is the DEFAULT (prophet / linear / additive); only an explicit unknown value refuses'

  horizon_gate_with_warning:
    formula: 'chronos: horizon > chronos_native_horizon requires allow_long_horizon == true; the response then carries a non-null warning naming the rollout count'
    domain: 'the Chronos server horizon and allow_long_horizon arguments'
    codomain: 'a ChronosResponse with warning: Some(..), or a validation refusal'
    invariants:
      - 'D-13. Past the native 64 steps the model rolls its own forecast forward as context, so accuracy degrades in a way the caller must consent to — the gate is informed consent, not a bound'
      - 'chronos_max_horizon (1024) still applies ABOVE the gate: allow_long_horizon does not unlock an unbounded horizon'
      - 'the warning is serialized only when it is present (skip_serializing_if), so a within-native response carries no warning key at all'

  shared_response_shape:
    formula: 'every server response carries {model, freq, n_history, predict_seconds, ds, yhat, yhat_lower, yhat_upper, diagnostics}; the fit server adds {fit_seconds, trend, components}; Chronos adds {context_used, quantiles, warning?}'
    domain: 'a successful tools/call against either server'
    codomain: 'the JSON object the client parses'
    invariants:
      - 'D-03: the SHARED core is what lets a client switch models by switching endpoint; the extras are what makes each server honest about what it actually did'
      - 'len(ds) == len(yhat) == len(yhat_lower) == len(yhat_upper) == horizon on both servers, and == len(trend) on the fit server'
      - 'the band brackets the point forecast pointwise: yhat_lower[i] <= yhat[i] <= yhat_upper[i] for every i'
      - 'timings are finite f64 seconds; a NaN there would make the diagnostics unusable for the sizing guidance the README gives'
      - 'components is a named map (yearly, weekly, trend, holiday names, multiplicative_terms), never a positional array'

  refusals_are_validation_errors:
    formula: 'every refusal in this contract maps to pmcp::Error::validation; only a genuine server-side failure maps to pmcp::Error::internal'
    domain: 'the error path of either server'
    codomain: 'the JSON-RPC error object the client receives'
    invariants:
      - 'the mapping is one function, `map_error`, over the two ForecastError variants — there is no second place a refusal can be classified'
      - 'an internal classification on a caller-fixable input is a DEFECT: it tells a client to retry or page an operator when the fix is in the request'
      - >
        MEASURED, AND NOT WHAT IT LOOKS LIKE. The JSON-RPC code pmcp 2.19.3 emits for
        `Error::validation` is -32603 — the JSON-RPC INTERNAL ERROR code. `Error::error_code()`
        returns None for BOTH the `Validation` and `Internal` variants (only `Protocol` carries an
        explicit code), so the transport falls back to -32603 for either. The numeric code alone
        therefore CANNOT distinguish a caller fault from a server fault on this SDK version. The
        discriminator pmcp actually ships is the message PREFIX thiserror renders from the variant:
        "Validation error: " versus "Internal error: ". The e2e suite pins BOTH — the code -32603
        and the "Validation error: " prefix — so a pmcp upgrade that changes either turns the suite
        red instead of silently reclassifying every refusal.
      - 'ForecastError::Internal is reserved for cases like "training diverged for every learning rate" — nothing the caller could have written differently'
      - 'the unknown-FIELD refusal is the one case that never reaches map_error: pmcp refuses it during argument deserialization and renders its own "Validation error: Invalid arguments for tool ..." message. It is still validation-class and still names the offending key.'

  pool_equality_under_load:
    formula: 'signature(response_under_load) == signature(response_alone) for every request in a concurrency_requests-wide burst, where signature = JSON of {ds, yhat, yhat_lower, yhat_upper, trend, components}'
    domain: 'concurrency_requests distinct requests issued against a pooled_app(pool_default) server, first sequentially and then all at once'
    codomain: 'the identical-count and max_abs_diff over the two runs'
    float_tolerance: 0.0
    invariants:
      - 'A CORRECTNESS CLAIM, falsified by a unit test, in CI, on every run and every host. Identical must be 8/8 in the mixed burst and 16/16 in the NeuralProphet stress, and max_abs_diff must be EXACTLY 0.0.'
      - 'what makes it hold is that there is NEVER a shared fit across requests: every request seeds its own simulation from constants.default_seed (or its own explicit seed) and owns its own model state'
      - 'this is the T-06-07 repudiation mitigation: a response is reproducible regardless of what else the server was doing when it was produced'
      - 'bit-identical, not close: the bar is 0.0 because a per-request-seeded deterministic pipeline has no legitimate source of variation under concurrency'

  pool_speedup_host_gated:
    formula: 'sequential_wall / concurrent_wall >= pool_speedup_min_x10 / 10, best of pool_speedup_best_of runs, on an aarch64 release build'
    domain: 'the same concurrency_requests-wide burst as pool_equality_under_load, timed'
    codomain: 'a wall-clock ratio'
    invariants:
      - 'A BENCHMARK CLAIM, NOT A CORRECTNESS CLAIM. It is falsified by `just forecast-pool-ratio` (plan 06-08) on a release build, best-of-3, and NEVER by a libtest assertion.'
      - >
        REVIEW-06-04, reached independently by both cross-AI reviewers. The unit test runs four Tokio
        workers over eight heterogeneous `spawn_blocking` fits with BLAS underneath; that ratio moves
        with CPU throttling and unrelated background load INDEPENDENTLY of the router serialisation the
        pool exists to remove. A hard `assert!(speedup >= 2.0)` inside the correctness suite is
        therefore a flake that fails for reasons the pool does not control, and a suite that cries wolf
        gets its failures ignored — including the equality failure that would actually matter.
      - 'the unit test instead PRINTS exactly one machine-parsable line, `POOL SPEEDUP: <r>x seq=<ms>ms conc=<ms>ms arch=<arch> profile=<debug|release> workers=4 cpus=<n>`, carrying its own provenance so a later comparison means something'
      - 'the measurement that motivates the pool: 1.0x with ONE router (the fits serialise behind pmcp streamable_http_server.rs:2094/:2122) and 3.9x with eight, on the spike-010 host'
      - 'a debug-profile or x86_64 run of the unit test is EXPECTED to print a low ratio and is not a failure of anything'

  default_seed_42:
    formula: 'seed defaults to constants.default_seed = 42 per request; no state is carried between requests'
    domain: 'the optional seed argument of the fit server'
    codomain: 'the uncertainty simulation and the NeuralProphet training RNG'
    invariants:
      - 'PER REQUEST, never per server: the seed is read from the arguments inside the call, so two concurrent requests with the same arguments produce the same answer and a request cannot observe another request s RNG position'
      - 'this is the mechanism behind pool_equality_under_load — remove it and the equality assertion is what goes red first'
      - 'an explicit seed overrides the default, so a caller who wants a different simulation asks for one rather than discovering one'

proof_obligations:

  - type: bound
    property: 'The fit server Rust bounds are equal to the contract constants, not merely similar to them'
    formal: 'types::MIN_POINTS == constants.fit_min_points AND types::MAX_POINTS == constants.fit_max_points AND types::MAX_HORIZON == constants.fit_max_horizon'
    applies_to: all

  - type: bound
    property: 'The Chronos door Rust bounds are equal to the contract constants'
    formal: 'chronos::CHRONOS_MIN_POINTS == constants.chronos_min_points AND chronos::CHRONOS_MAX_POINTS == constants.chronos_max_points AND chronos::CHRONOS_MAX_HORIZON == constants.chronos_max_horizon'
    applies_to: all

  - type: invariant
    property: 'A ds array that is unsorted, duplicated or contains an impossible calendar date is refused before any fit is entered'
    formal: 'forall ds: not(strictly_ascending(ds) and all_calendar_dates(ds)) implies result is Validation'
    applies_to: all

  - type: invariant
    property: 'A date string is accepted only at exactly ten ASCII bytes of YYYY-MM-DD shape'
    formal: 'forall s: parse_date(s) = Ok(_) implies len(s) == 10 and s.is_ascii() and s[4] == s[7] == "-"'
    applies_to: all

  - type: completeness
    property: 'The frequency allowlist is closed: exactly D, W and MS are accepted and every other value refuses by name'
    formal: 'forall f: future_days(_, _, f) = Ok(_) iff f in {D, W, MS}'
    applies_to: all

  - type: bound
    property: 'interval_width is accepted only strictly inside the open unit interval'
    formal: 'forall w: accept(w) iff 0.0 < w and w < 1.0'
    applies_to: all

  - type: invariant
    property: 'A cap is accepted only on the logistic growth arm; on every other arm — explicit linear, explicit flat, or the defaulted arm carrying no growth key — it is a validation refusal, never an accepted-and-dropped knob'
    formal: 'forall args: args.cap is Some and args.growth != logistic implies result is Validation'
    applies_to: all

  - type: invariant
    property: 'Logistic growth is never fitted without a cap that exceeds the observed maximum'
    formal: 'growth == logistic and result is Ok implies cap.is_some() and cap > max(y)'
    applies_to: all

  - type: invariant
    property: 'A constant series is refused before the optimiser is entered'
    formal: 'min(y) == max(y) implies result is Validation and no design was built'
    applies_to: all

  - type: completeness
    property: 'The advertised schema is strict and names exactly the three required fields'
    formal: 'schema_for!(ForecastArgs).additionalProperties == false and required == {ds, y, horizon}'
    applies_to: all

  - type: completeness
    property: 'Every unknown enum value for model, growth or seasonality_mode refuses with a message listing the accepted set'
    formal: 'forall v not in accepted(field): result is Validation and message contains accepted(field)'
    applies_to: all

  - type: bound
    property: 'Every holiday name is bounded in BYTES at the door, before it is cloned into any design column'
    formal: 'forall args, forall h in args.holidays: result is Ok implies len_bytes(h.name) <= constants.fit_max_holiday_name_len'
    applies_to: fit

  - type: invariant
    property: 'The refusal for an oversized holiday name names the holiday index and the observed byte length and never the name itself'
    formal: 'forall h with len_bytes(h.name) > constants.fit_max_holiday_name_len: result is Validation and message contains index(h) and len_bytes(h.name) and not contains h.name'
    applies_to: fit

  - type: invariant
    property: 'The aggregate holiday-date ceiling is enforced INSIDE the loop, so a request already known to be over it never parses the remaining holidays'
    formal: 'forall args: running_sum(k) > constants.fit_max_holiday_dates_total implies result is Validation and forall j > k: h_j.dates were never parsed'
    applies_to: fit

  - type: invariant
    property: 'A Chronos horizon past the native window is refused without opt-in, and warned about with it'
    formal: 'horizon > constants.chronos_native_horizon implies (allow_long_horizon or result is Validation) and (allow_long_horizon implies response.warning.is_some())'
    applies_to: all

  - type: invariant
    property: 'Every successful response carries the shared field set with equal-length, pointwise-bracketing arrays'
    formal: 'len(ds) == len(yhat) == len(yhat_lower) == len(yhat_upper) == horizon and forall i: yhat_lower[i] <= yhat[i] <= yhat_upper[i]'
    applies_to: all

  - type: soundness
    property: 'Every refusal in this contract reaches the client as a validation-class JSON-RPC error, never an internal one'
    formal: 'forall refusal r in this contract: code(r) == code(pmcp::Error::validation)'
    applies_to: all

  - type: determinism
    property: 'A response computed under a concurrency_requests-wide burst is bit-identical to the same response computed alone'
    formal: 'forall req: signature(concurrent(req)) == signature(sequential(req)) and max_abs_diff == 0.0'
    applies_to: all

  - type: bound
    property: 'On the gated host, the pooled server clears the speed-up floor; the ratio is measured by a benchmark recipe and never asserted by a unit test'
    formal: 'best_of(constants.pool_speedup_best_of, sequential_wall / concurrent_wall) >= constants.pool_speedup_min_x10 / 10 (evaluated by `just forecast-pool-ratio`, aarch64 release only)'
    applies_to: all

  - type: determinism
    property: 'The seed is per request and defaults to 42; no RNG state is carried between requests'
    formal: 'forall req: seed(req) == req.seed.unwrap_or(constants.default_seed) and forall req1 req2: result(req1) is independent of order(req1, req2)'
    applies_to: all

  - type: bound
    property: 'The work one holiday-carrying request can buy is bounded by a constant this file names, not merely by four factors checked in isolation'
    formal: 'forall args: accept(args) implies (len(args.ds) + args.horizon) * holiday_columns(args) <= constants.fit_max_holiday_design_cost'
    applies_to: all

  - type: completeness
    property: 'The door surface is fully enumerated: every caller-settable field has a knobs entry and every knobs entry names a field that exists, and every non-pending cost axis names a bound that exists'
    formal: 'knobs(door_surface) == properties(schema_for!(ForecastArgs)) union properties(schema_for!(HolidayArg)) and forall a in cost_axes: a.bound in keys(constants) or (a.bound == measured_at_structural_maximum and a.measured_seconds < 2.0) or a.bound matches unbounded_pending_*'
    applies_to: all

  - type: bound
    property: 'The Poisson mean the logistic uncertainty simulation draws is bounded at the door, before the design is built'
    formal: 'forall args: accept(args) and args.growth == logistic implies changepoint_count(len(args.ds)) * (t_max(args) - 1) <= constants.fit_max_logistic_changepoint_lambda'
    applies_to: all

falsification_tests:

  - id: FALSIFY-BOUNDARY-001
    rule: 'The fit server bounds in Rust equal the contract constants'
    prediction: '`types::tests::bounds_match_contract` reads constants.fit_min_points, fit_max_points and fit_max_horizon out of THIS file and finds them equal to MIN_POINTS (10), MAX_POINTS (20000) and MAX_HORIZON (3650).'
    test: 'cargo test -p aprender-forecast --lib types::tests::bounds_match_contract'
    if_fails: 'A bound was changed in exactly one of the two places. Whichever moved, the client-visible boundary and the document describing it now disagree, and any client written against this contract is wrong about what the endpoint accepts.'

