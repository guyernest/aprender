      `..._just_under_the_changepoint_lambda_bound_is_accepted` sends horizon 840 (lambda
      19 974.2, asserted within 10% of the bound) and observes a full-length band; and
      `the_linear_arm_at_the_same_geometry_is_still_accepted` proves the refusal is keyed on
      `Growth::Logistic` rather than firing for everyone. Each computes its own lambda from
      `prophet::changepoint_count` and asserts its geometry is on the side its name claims.
      The SERVER, the same two sides through a live streamable-HTTP router:
      `e2e::refuses_logistic_changepoint_lambda_over_bound` and
      `e2e::accepts_logistic_changepoint_lambda_just_under_bound`. The server refusal was
      OBSERVED RED: with `fit_max_logistic_changepoint_lambda` and the Rust constant raised
      past the structural maximum, the server ACCEPTED the same request and returned a
      forecast. Finally `prophet::changepoints::changepoint_count_equals_the_design_it_describes`
      sweeps the point count and pins the door's changepoint count to `make_design`'s, so the
      bound cannot be evaded by the door and the sampler disagreeing.
    test: 'cargo test -p aprender-forecast --lib types::tests::cost_bounds_match_contract forecast::tests changepoint_count_equals AND cargo test -p aprender-mcp-forecast --lib e2e::'
    if_fails: >
      A 1 132-byte unauthenticated request that satisfies every existing bound
      (fit_max_points, fit_max_span_days, fit_max_horizon) buys 2.334 s of CPU against a
      default pool of K=8 — eight such requests saturate it — because those three bounds are
      checked in ISOLATION and it is their RATIO that sizes this cost, with
      dates::future_days multiplying the horizon COUNT by ~30.44 for "MS". FIT_BUDGET_SECS
      cannot substitute: this cost is spent in predict, which runs AFTER the fit returns with
      no budget at all. NOTE: do not "fix" this by clamping inside prophet::poisson — that
      removes the wall and silently reintroduces the truncation 06-13 exists to delete. The
      refusal belongs at the door (D-11).

  - id: FALSIFY-BOUNDARY-021
    rule: 'holidays[].name is bounded in BYTES at the door, first in the holiday loop, on a contract-owned value'
    prediction: >
      Assertions at three layers falsify this rule. The CONSTANTS layer:
      `types::tests::cost_bounds_match_contract` asserts
      `types::MAX_HOLIDAY_NAME_LEN == constants.fit_max_holiday_name_len`, so perturbing the
      value HERE — touching no Rust — turns it red naming the key it read (OBSERVED). The
      LIBRARY door, four-sided:
      `forecast::tests::a_holiday_name_over_the_length_bound_is_refused` (one byte over),
      `..._at_the_length_bound_is_accepted` (exactly at the bound, full response),
      `a_holiday_name_whose_char_count_fits_but_whose_byte_length_does_not_is_refused`
      (101 multi-byte characters — 101 chars UNDER the bound, 202 bytes OVER it, the case a
      `chars().count()` rewrite silently breaks, and the only test in the suite that such a
      rewrite turns red), and
      `an_empty_holiday_name_is_not_refused_by_the_length_bound` (the bound is one-sided by
      design, so a later tidy-up cannot answer the empty-name question by accident). The
      SERVER, both sides through a live streamable-HTTP router:
      `e2e::refuses_holiday_name_over_length_bound` and
      `e2e::accepts_holiday_name_at_length_bound`. The server refusal was OBSERVED RED:
      before the door check existed, the server ACCEPTED a 201-byte name and returned a
      full-shape forecast whose `components` map carried that name as a key.
    test: 'cargo test -p aprender-forecast --lib -- types::tests::cost_bounds_match_contract forecast::tests AND cargo test -p aprender-mcp-forecast --lib e2e::'
    if_fails: >
      An unauthenticated request turns ONE occurrence of an arbitrary-length string into
      ~2 000 owned copies plus ~10 000 byte-wise sort comparisons — a ~2 000:1 amplification
      off a field that, at the close of plan 06-14, was enforced by NOTHING. Do not "fix" it
      by measuring instead: this axis has NO structural maximum (neither transport caps the
      body), so a wall written for an arbitrarily chosen length would look like evidence and
      be none. That is why 06-14 held it open with a red test rather than a measurement.

  - id: FALSIFY-BOUNDARY-022
    rule: 'The refusal for an oversized holiday name names the index and the observed byte length and never the name itself'
    prediction: >
      `forecast::tests::the_oversized_name_refusal_names_the_length_and_not_the_name` sends a
      holiday whose name is a distinctive repeated token one byte over the bound and asserts
      the refusal message contains the holiday's INDEX and the observed BYTE LENGTH and does
      NOT contain the oversized name. The assertion is non-vacuous by construction: the token
      is a string the message would contain if `h.name` were interpolated, and every OTHER
      refusal in the same loop does interpolate `h.name` — which is precisely why the length
      check is FIRST in the loop, so those messages can only ever carry a bounded name.
    test: 'cargo test -p aprender-forecast --lib -- forecast::tests::the_oversized_name_refusal_names_the_length_and_not_the_name'
    if_fails: >
      T-06-38. Echoing an oversized attacker-controlled string back into an error message
      re-materialises the very bytes the bound refuses, and reflects that content into every
      log and trace the refusal reaches. The caller needs to know WHICH holiday and HOW LONG;
      they already have the name.

  - id: FALSIFY-BOUNDARY-023
    rule: 'The aggregate holiday-date ceiling is enforced INSIDE the holiday loop, so a request already known to be over it never parses the remaining holidays'
    prediction: >
      `forecast::tests::the_aggregate_dates_refusal_fires_inside_the_holiday_loop` and
      `e2e::refuses_holiday_dates_total_before_parsing_the_rest` cross the aggregate ceiling
      at the ELEVENTH holiday while every LATER holiday carries `"2020-1-01"` — nine bytes,
      which `parse_date`'s SHAPE gate rejects. If the check moved back after the loop the
      caller would receive the DATE-SHAPE refusal instead of the aggregate one, so these
      discriminate POSITION and not merely presence; a grep for the constant cannot make that
      claim. Both were OBSERVED RED against the unmoved check, reporting
      `bad date "2020-1-01": want YYYY-MM-DD`.
      `holidays_carrying_exactly_the_total_bound_are_accepted` is the two-sided control that
      catches an in-loop comparison written as `>=` instead of `>`, and
      `refuses_holiday_dates_total_over_bound` still pins the post-loop refusal, which is
      KEPT because only it has seen every holiday and can report the request's EXACT total.
    test: 'cargo test -p aprender-forecast --lib -- forecast::tests AND cargo test -p aprender-mcp-forecast --lib e2e::'
    if_fails: >
      1 000 holidays of 1 000 dates run ~1 000 000 `parse_date` calls and allocate ~8 MB of
      `Vec<i64>` AFTER the door already has the information to refuse the request (WR-03).
      The amplification is roughly 1:1 with the payload, so this is a hygiene defect rather
      than a second CR-01 — but it is unbounded work performed on a request already known to
      be bad, on exactly the surface this phase exists to bound, and the comment above the
      accumulation claimed the property the code lacked.


kani_harnesses:

  # DECLARED, NOT EXECUTED. cargo-kani is not installed in this repository and no
  # #[kani::proof] harness exists anywhere under crates/. Each entry names the
  # runnable, identically bounded test that is the ACTUAL evidence.
  - id: KANI-BOUNDARY-001
    obligation: 'The future date grid this boundary produces is strictly increasing for every allowed frequency, up to the maximum horizon'
    property: 'forall freq in {D, W, MS}, forall start day, forall horizon <= constants.fit_max_horizon: future_days(start, horizon, freq) is strictly increasing, and for MS every element is the 1st of some month'
    bound: 3650
    strategy: bounded_int
    harness: 'NOT EXECUTED — the evidence is the runnable, identically bounded grid test `prophet::parity::future_days_strictly_increasing_bounded` in crates/aprender-forecast/src/prophet.rs, which enumerates 3 frequencies x 20 start days spanning leap years and month ends x horizons {1, 28, 365, 3650}'

  - id: KANI-BOUNDARY-002
    obligation: 'Only a ten-ASCII-byte YYYY-MM-DD string is accepted as a date'
    property: 'forall s: parse_date(s) = Ok(_) implies len(s) == 10 and s.is_ascii() and s[4] == "-" and s[7] == "-" and the other eight bytes are ASCII digits'
    bound: 10
    strategy: bounded_int
    harness: 'NOT EXECUTED — a model checker over arbitrary UTF-8 strings would need a string theory the harness cannot bound usefully; the evidence is the nine `dates::tests` refusal cases (trailing content, T-suffix, leading and trailing whitespace, empty, non-ASCII prefix, nine-byte, impossible calendar date, out-of-range month) plus the four e2e shape cases driven through a live server'

  - id: KANI-BOUNDARY-003
    obligation: 'A response under concurrency equals the response computed alone'
    property: 'forall req: signature(concurrent(req)) == signature(sequential(req))'
    bound: 16
    strategy: bounded_int
    harness: 'NOT EXECUTED — the property is about a Tokio runtime, a router pool and a blocking thread pool; a bounded checker would have to stub all three and would then prove a property about the stubs. The evidence is `pool_equality::eight_concurrent_requests_are_bit_identical_to_sequential` (8/8, max_abs_diff 0.0) and `pool_equality::sixteen_concurrent_neuralprophet_fits_stay_identical` (16/16)'

qa_gate:
  id: F-FORECAST-BOUNDARY-001
  name: 'Forecast tool boundary gate'
  description: >
    The blocking gate for the tool-boundary claims (SC1 refusals, SC5 equality under load). Every
    check below is a runnable test named in the FALSIFY-BOUNDARY entries above, and every bound it
    asserts is READ from this file at test time rather than duplicated as a Rust literal. The gate
    is deliberately split by claim KIND: the correctness checks are unit-falsifiable and run in CI
    on every host, while the single benchmark check is host-gated and runs under
    `just forecast-pool-ratio` (REVIEW-06-04). Mixing them would put a wall-clock ratio measured
    under four Tokio workers into the suite that has to be trusted when it goes red.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'the fit server and Chronos door Rust bounds are asserted EQUAL to the contract constants'
    - 'every SC1 malformed input is refused through a live streamable-HTTP server, each with its own e2e case (>= 18 refusal cases)'
    - 'the four REVIEW-06-U2 malformed-date shapes are refused: trailing content, empty, whitespace, non-ASCII'
    - 'every refusal is validation-class, with the numeric code pinned'
    - 'the advertised inputSchema has additionalProperties false and requires exactly ds, y, horizon'
    - 'the shared response shape holds on four happy paths spanning both models, MS + multiplicative, and logistic + holidays'
    - 'responses under an 8-wide and a 16-wide burst are bit-identical to their sequential twins (max_abs_diff 0.0)'
    - 'exactly one well-formed POOL SPEEDUP line is printed, carrying ratio, both walls, arch, profile, workers and cpus'
    - 'the spawned binary answers the same one tool over stdio and refuses an unknown key (local; dark in CI pending 06-08)'
    - 'HOST-GATED, NOT IN CI: best-of-3 pool speed-up >= 2.0 on an aarch64 release build, via `just forecast-pool-ratio`'
  pass_criteria: >
    All FALSIFY-BOUNDARY correctness tests pass on every host. FALSIFY-BOUNDARY-011 is HOST-GATED
    and is NOT part of this guarantee: `just forecast-pool-ratio` exists and passes on aarch64
    release (best 5.162x against a 2.0 bar, 06-EVIDENCE.md §3), but every CI job here is X64 and
    builds debug, so that number is evidence on ONE host and not a claim this guarantee can make
    everywhere. Measured on one arch is not measured. FALSIFY-BOUNDARY-012 still holds — the `POOL SPEEDUP`
    line and its provenance fields are printed and format-checked by the unit test today, so the
    deferred gate can be armed later without re-deriving the format. A refusal case that has only ever been observed passing is not
    evidence: each refusal message asserted here must have been seen RED under an induced change
    (edit the needle, observe the named case fail, restore).
  falsification: >
    The bound checks are induced-RED from THIS FILE alone: change `constants.fit_max_horizon` from
    3650 to 3651 — touching no Rust — and `types::tests::bounds_match_contract` goes red naming the
    contract value it read, proving the assertion reads its bar from here at test time rather than
    duplicating it. A byte-identical revert restores green. The same holds for every
    `constants.chronos_*` value against `chronos_bounds_match_contract`.
