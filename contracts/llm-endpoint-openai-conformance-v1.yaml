qa_gate:
  id: F-LLM-CONF-001
  name: 'Internal OpenAI-compatible LLM endpoint conformance gate'
  description: >
    The blocking gate for the endpoint's conformance claims. Rows 004-012 are unit-falsifiable and run
    in CI from CI fragment 530; rows 001-003 are staged (plans 09-02 and 09-03 add their `test:` lines
    when their tests exist); rows 013-016 are LIVE and carry the explicit LIVE-PENDING marker until the
    deployed records back them. A claim not backed by a row here and an accepted record is not licensed.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'scripts/check_contract_test_binding.sh reports zero findings for this contract'
    - 'both pmcp.run client request shapes parse into ChatCompletionRequest'
    - 'ResponseToolCall serializes arguments as a JSON string'
    - 'every committed conformance-*.json record matches its declared profile; the glob matching nothing fails'
    - 'the fixed profile requires the eight probes, the D-04 gate reading ✓, and an explicit unreleased_at_pin reason for any unreleased fix'
    - 'LIVE, NOT IN CI: the deployed 401 proofs, the two-tool turns and the per-turn cost record (rows 013-016)'
  run: 'cargo test -p aprender-serve --lib api::llm_endpoint_conformance_tests'
  pass_criteria: 'FALSIFY-LLM-CONF-004..012 pass on every host and each has been observed RED under an induced negative; rows 001-003 gain tests from plans 09-02/09-03; rows 013-016 gain live records from plans 09-07/09-08/09-12.'
  falsification: >
    Flip one probe verdict in a committed fixed record to a cross and the reader test must go red
    naming the probe; revert and it goes green. Delete every conformance-*.json and the reader must
    fail, not pass.
