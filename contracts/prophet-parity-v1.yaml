    harness: 'NOT EXECUTED — the evidence is the D-09 diagnostics asserted inside every `prophet::parity::<fixture>_fit_objective_and_forecast` test (FALSIFY-PROPHET-012); a bounded model checker cannot reason about L-BFGS termination without stubbing the optimiser, which would prove a property about the stub'

qa_gate:
  id: F-FORECAST-PROPHET-001
  name: 'Prophet 1.4.0 parity ladder gate'
  description: >
    The blocking gate for the Prophet port correctness claim (SC2). Every check below is a rung of
    the ladder in `crates/aprender-forecast/src/prophet.rs::parity`, and every tolerance it asserts
    is read from THIS file at test time. A rung that has only ever been observed passing is not
    evidence: each FALSIFY-PROPHET test must have been seen RED under an induced tolerance change
    (tighten the equation float_tolerance here, observe the named test fail, restore).
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'data preparation parity is exact on all seven fixtures'
    - 'objective at Python MAP within 1e-9 on the three fixtures publishing -lp'
    - 'Python parameters through Rust predict, absolute on Peyton and relative to y_scale everywhere'
    - 'named component parity and the trend*(1+mul)+add == yhat reconstruction identity'
    - 'fitted objective within 0.5 of Python on all seven fixtures'
    - 'Peyton future forecast inside Prophet own optimiser disagreement band'
    - '80% band widths within 2% (history, future), last-30 within 2%, trend band within 5%'
    - 'D-09 diagnostics: rounds <= 8, status Stalled or Converged, budget_hit false'
    - 'no tolerance literal inside the parity test module — every bar is contract-read'
  pass_criteria: 'All FALSIFY-PROPHET tests pass and each was observed RED under an induced tolerance change.'
  falsification: >
    OBSERVED, not merely prescribed. Tighten `equations.band_width_rel.float_tolerance` from 0.02 to
    0.0001 — changing ONLY this file, not one line of Rust — and re-run
    `cargo test -p aprender-forecast --lib prophet::parity`: FALSIFY-PROPHET-009 goes red on all
    seven fixtures (25 passed / 7 failed) and each failure quotes the NEW bar (`over the contract bar
    1e-4`), proving the ladder reads its bars from here at test time rather than duplicating them as
    literals. A byte-identical revert restores 32 passed / 0 failed. Note that
    `fitted_objective_slack` cannot be induced-RED by TIGHTENING a positive value: every committed
    fixture lands BELOW Python's objective (-0.0095 to -1.73), so the induced negative there is a
    NEGATIVE slack (e.g. -1.0), not a smaller positive one.
