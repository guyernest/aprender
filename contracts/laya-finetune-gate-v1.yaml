run_dir_layout:
  # The ONE layout the fixture generator (08-02), the trainer (08-08) and the packer
  # (08-05 / 08-09) all use.
  data_dir:
    - task.json
    - train.jsonl
    - eval.jsonl
    - 'shift.jsonl (OPTIONAL shift probe, 1.4.0)'
  run_dir:
    - 'checkpoint/model.safetensors (F16 weights; the `temperature` buffer F32)'
    - 'checkpoint/rl_agent_config.json (calibrated T written into temperature_by_options[bucket])'
    - checkpoint/encoder/config.json
    - checkpoint/tokenizer/tokenizer.json
    - 'checkpoint/tokenizer/tokenizer_config.json (written ALREADY in the form Laya''s _fix_tokenizer_config produces — tokenizer_class: PreTrainedTokenizerFast — because Laya''s loader otherwise REWRITES it in place, changing a hashed input after the fact)'
    - 'task.json (byte copy of the data dir''s)'
    - recipe.json
    - gate-report.json
    - eval-probs.json
    - zero-shot-probs.json
    - probes.json
    - 'variance-report.json (only when more than one seed ran)'
    # ---- 1.4.0 additions (every entry above is byte-identical to 1.3.0) ----
    - 'rescore-noise.json (the float64 re-score noise record, rescore_noise_schema; laya-parity-v1 A1)'
    - 'seeds/seed-<s>/eval-probs.json (every gate seed, 1.4.0)'
    - 'shift-probs.json (only with shift.jsonl)'
    - 'shift-zero-shot-probs.json (only with shift.jsonl)'
  run_dir_notes:
    variance_report: 'variance-report.json is written always for production (three seeds) under seed_selection (1.4.0); the entry above keeps its 1.x wording for legacy runs'

recipe_json_schema:
  # Written BEFORE any eval score exists (equation recipe_before_scores). recipe_id is the sha256
  # of the exact recipe.json file bytes — one definition; the Rust side never re-serializes.
  variant: 'string: "production" | "synthetic-fixture"'
  optimizer: 'string: "adamw"'
  encoder_lr: 'number: recipe.encoder_lr'
  head_lr: 'number: recipe.head_lr'
  eta_min: 'number: recipe.eta_min'
  weight_decay: 'number: recipe.weight_decay'
  grad_clip: 'number: recipe.grad_clip'
  batch_size: 'integer: recipe.batch_size'
  proper_reward_w_sph: 'number: recipe.proper_reward_w_sph'
  proper_reward_w_rps: 'number: recipe.proper_reward_w_rps'
  schedule: 'string: "cosine"'
  shots_per_class: 'integer >= 0 (production: >= 1)'
  epochs: 'integer >= 0 (production: per recipe.epoch_rule; under early_stopping this is the MAXIMUM)'
  seed: 'integer: the declared seed (split seed and first gate seed); under the legacy rule (no seed_selection) the production shipped checkpoint is this seed; under seed_selection the SHIPPED seed is gate-report seeds.shipped'
  base: 'object {family, repo, revision, checkpoint, sha256} (production: == base block)'
  early_stopping: 'OPTIONAL object {monitor, mode, eval_every_epochs, first_candidate_epoch, patience_epochs, min_delta, restore, tie_break} equal to the early_stopping block; ABSENT = fixed_epochs. Since 1.4.0 the only other optional key is seed_selection.'
  seed_selection: 'OPTIONAL (1.4.0) object {policy, seeds, rank_scale, tie_break} equal to seed_policy (selection, variance_seeds, rank_scale, tie_break), written before training; REQUIRED for production under 1.4.0 (train.py always writes it); ABSENT = the 1.x declared-seed rule (seed_policy.legacy_rule)'

gate_report_schema:
  schema: 'string: "laya-gate-report-v1" — UNCHANGED under 1.4.0: every 1.4.0 addition (seeds.policy / shipped / per_seed, rescore_noise_sha256, shift_probe, inputs_sha256.shift_jsonl) is OPTIONAL, so every 1.x report still parses'
  pass: 'boolean — must equal the Rust recomputation (gate_pass)'
  thresholds: 'object {min_macro_f1_margin, max_ece, ece_bins} — must equal this file''s constants, else the report is refused (D-07 fail-closed)'
  zero_shot: 'object {macro_f1, f_avg, ece, n}'
  fine_tuned: 'object {macro_f1, f_avg, ece_pre, ece_post, nll, n}'
  margin: 'number: fine_tuned.macro_f1 - zero_shot.macro_f1'
  calibration: 'object {bucket, t_fitted, t_applied, clamp_hit, slice_size, slice_ids, slice_ids_sha256} — slice_ids is the SORTED list of 0-based train.jsonl row indices in the calibration slice (indices only, never text), so the Rust verifier re-derives disjointness from it'
  seeds: 'object {declared, n, label} — label is the literal "single seed" when n == 1; else "median-ECE seed of N seeds" when policy is "median_ece" (1.4.0), else (a legacy 1.x multi-seed run) "mean ± sd over N seeds" (seed_policy.rule). 1.4.0 adds OPTIONAL policy ("median_ece"), shipped (integer: the median seed) and per_seed (array in seed order of {seed, macro_f1, f_avg, ece_post, margin, pass, t_applied, rank_key, eval_probs_sha256, model_safetensors_sha256}); present exactly when recipe.json carries seed_selection'
  device_used: 'string: read from the model parameters after the move'
  device_is_cpu: boolean
  torch_version: string
  recipe_id: 'string: sha256 hex of recipe.json bytes'
  inputs_sha256: 'object {task_json, train_jsonl, eval_jsonl, base_model, tokenizer_json}; 1.4.0 adds OPTIONAL shift_jsonl (present exactly when the data dir carries shift.jsonl)'
  eval_probs_sha256: string
  zero_shot_probs_sha256: string
  probes_sha256: string
  rescore_noise_sha256: 'OPTIONAL (1.4.0) string: sha256 of rescore-noise.json; ABSENT = the laya-parity-v1 A1 floor rule (bound 1.0e-5 for both sets)'
  shift_probe: 'OPTIONAL (1.4.0) object {gate_clause: false, n, zero_shot {macro_f1, f_avg, ece}, fine_tuned {macro_f1, f_avg, ece_post}, margin, probs_sha256, zero_shot_probs_sha256} — present exactly when the data dir carries shift.jsonl; REPORTED, never in gate_pass'
  f_avg_rule: 'f_avg may be null for non-stance tasks'

eval_probs_schema:
  # The SAME schema serves eval-probs.json (fine-tuned, calibrated) and zero-shot-probs.json (the
  # declared base on the same rows). No eval TEXT is ever written, so no tweet text reaches an
  # artifact.
  rows: 'array of {row: integer (0-based eval.jsonl index), text_sha256: string, probabilities: array of K numbers in criteria order}'
  labels: 'array of criteria names in task.json order'

rescore_noise_schema:
  # 1.4.0 (laya-parity-v1 A1): rescore-noise.json, written by train.py at scoring time and hash-bound by
  # gate-report rescore_noise_sha256. Rust RECOMPUTES max_abs and bound from `rows` and the scored
  # files; the reported values are cross-checked only (laya-parity-v1 rescore_noise_reference).
  schema: 'string: "laya-rescore-noise-v1"'
  reference: 'string: "float64"'
  k: 'integer: copy of laya-parity-v1 constants.pack_rescore_noise_k; must equal it'
  floor_abs: 'number: copy of laya-parity-v1 equations.pack_rescore_probs_abs.float_tolerance; must equal it'
  control_max_abs: 'number: max |dz| of the manual fp32 forward against the Scorer''s logits on control_rows; must be 0.0'
  control_rows: 'array of integers: the first min(5, n) eval row indices the control forwarded'
  sets: 'array of EXACTLY two objects, `which` "fine_tuned" (the shipped checkpoint) and "zero_shot" (the declared base), each {which, scored: "eval", t_applied, n, argmax_agree, max_abs, bound, rows: [{row: integer, probabilities_f64: array of K numbers in criteria order}] covering every eval row once, in order}'

probes_json_schema:
  # For each decide-apr-v1 probe input, in order, computed by Laya's OWN predict path on the F16
  # reload, through the decide-apr-v1 synthetic probe task.
  probes: 'array of {input_index: integer, tokens: integer (built-row length), label: string, probabilities_f32_hex: array of K strings (f32 bit patterns, 8 hex digits each)}'

equations:

  gate_pass:
    formula: 'pass == ((ft.macro_f1 - zs.macro_f1 >= gate_min_macro_f1_margin) AND (ft.ece_post <= gate_max_ece)), where ft and zs are RECOMPUTED in Rust from eval-probs.json and zero-shot-probs.json against the eval labels; when recipe.json carries seed_selection (1.4.0) ft is the SHIPPED (median) seed''s run, selected per seed_selection_median'
    domain: 'a run dir whose eval-probs.json and zero-shot-probs.json have each been verified within the per-set bound(c, s) of laya-parity-v1 2.0.0 A1 (pack_rescore_probs_abs floor 1.0e-5, noise-referenced when the run carries rescore-noise.json) of the Rust re-score of the packed artifact and of the declared base (argmax exact)'
    codomain: 'accept (pass recorded) or a typed refusal naming the failed clause'
    invariants:
      - 'thresholds are READ from this file; a report whose `thresholds` differ from the constants is refused (D-07, fail-closed)'
      - 'a reported metric further than gate_metric_recompute_abs from its Rust recomputation is refused; a reported `pass` disagreeing with the recomputed one is refused — recomputing pass from REPORTED metrics would let an edited report pass'
      - 'the gate compares against the zero-shot DECLARED BASE on the SAME eval rows, not against a remembered number'
      - 'the ECE is ece_post, computed with the APPLIED temperature (calibration_fit_bounded)'
    preconditions:
      - 'split_disjointness holds for the run'

  ece_top_label:
    formula: 'conf_i = max_k p_ik; pred_i = argmax_k p_ik; bin(i) = min(floor(conf_i * ece_bins), ece_bins - 1); ECE = sum_b (n_b / N) * |acc_b - conf_b|'
    domain: 'N rows of K probabilities (rows sum to 1) with true labels'
    codomain: 'ECE in [0, 1]'
    invariants:
      - 'THE HOUSE DEFINITION: aprender-core calibration::expected_calibration_error_top_label (contracts/calibration-v1.yaml), frozen cases scripts/setfit_fixtures/claims_stats/ece_top_label_cases.json'
      - 'recorded deviation: spike 024 binned right-closed (lo, hi]; the two differ only for a confidence exactly on a bin edge. One Rust ECE implementation (OPS-03) outweighs byte-matching an informational spike number'
      - 'the Python trainer reports with the same floor binning; the Rust verifier is the authority'

  calibration_fit_bounded:
    formula: 'T_fitted = argmin_{T in [calibration_temp_min, calibration_temp_max]} NLL(softmax(z / T), y) over the calibration slice; T_applied = clamp(T_fitted, calibration_temp_min, calibration_temp_max); clamp_hit = (T_fitted at a bound)'
    domain: 'the fine-tuned model''s logits on the calibration slice (F16 reload)'
    codomain: 'T_applied written into rl_agent_config.json temperature_by_options[bucket]; clamp_hit recorded'
    invariants:
      - 'Laya''s loader clamps T to [0.5, 5.0] at every load (Pitfall 6), so a T outside the range would be served as the bound; fitting within the range makes the reported and served T identical'
      - 'ece_post is computed with T_APPLIED; if the clamp is hit and ECE still fails, the gate fails — the fail-closed design'
      - 'the calibration slice is stratified, seeded, at least calibration_slice_fraction of the shots and at least calibration_slice_min_per_class rows per class (D-06, RESEARCH A9)'

  split_disjointness:
    formula: 'normsha(eval) ∩ normsha(train) = ∅ AND calib ⊂ train AND fit = train \ calib AND forall group g of train rows with equal normsha: g ⊂ fit OR g ⊂ calib AND forall g: |labels(g)| == 1, where normsha(t) = sha256(collapse_ws(trim(NFC(t))))'
    domain: 'data dir train.jsonl / eval.jsonl and gate-report calibration.slice_ids'
    codomain: 'accept, or a typed refusal naming the overlap or the conflicting group'
    invariants:
      - 'text-disjoint, not merely row-disjoint: duplicates in the shots form ONE group that lands wholly in fit or wholly in calibration'
      - 'a group whose copies carry different labels is REFUSED, not resolved'
      - 'the calibration slice is stratified and seeded (declared_seed), per D-06'
      - 'the Rust verifier re-derives all of this from slice_ids (row indices only) and the data dir, plan 08-09'

  declared_seed_ships:
    formula: 'under the legacy rule (recipe.json has no seed_selection): shipped_checkpoint.seed == seed_policy.declared_seed'
    domain: 'a legacy (1.x) run dir, possibly with variance seeds'
    codomain: 'the declared-seed checkpoint in run_dir/checkpoint'
    invariants:
      - 'never the best seed on eval: choosing the best of N on the eval split is selection on the test set (D-08)'
      - 'variance seeds produce variance-report.json only'
      - 'since 1.4.0 production runs carry seed_selection and ship the median seed per seed_selection_median; a legacy run is judged under this equation and is never deploy-eligible (seed_policy.legacy_rule)'

  seed_selection_median:
    formula: 'for recipe.json carrying seed_selection: rank_key(s) = floor(ece_post(s) x rank_scale) for s in variance_seeds; order = sort by (rank_key ascending, seed ascending); shipped = order[(N - 1) / 2] (= order[1] for N = 3); pass == ((ft_shipped.macro_f1 - zs.macro_f1 >= gate_min_macro_f1_margin) AND (ft_shipped.ece_post <= gate_max_ece)), zs the shared zero-shot baseline'
    domain: 'a production run dir with seeds/seed-<s>/eval-probs.json for every s in variance_seeds, a shared zero-shot-probs.json and gate-report seeds.per_seed'
    codomain: 'the shipped seed and pass, or a typed refusal naming the field'
    invariants:
      - 'Rust RE-DERIVES the selection from the per-seed eval-probs files (recomputed ece_post per seed) and refuses a report whose `shipped` differs, whose shipped seed''s eval_probs_sha256 differs from the top-level eval_probs_sha256, or whose checkpoint/model.safetensors sha256 differs from the shipped seed''s model_safetensors_sha256'
      - 'production requires EXACTLY the three seeds of variance_seeds (production_seeds_required)'
      - 'a recomputed ece_post within the recompute tolerance of a rank_scale grid line is refused rather than guessed (why_quantized)'
      - 'the median is selected WITH eval labels and is recorded as a selection on the gate eval set (seed_policy.honesty); median, never best'
      - 'the non-shipped seeds are recomputed but never re-scored (seed_policy.retention_rule)'

  eval_set_in_distribution:
    formula: 'E = dedup_first_nfc_trim_ws( [r in validation ++ train (file order) : r.id not in shots(s64-seed13) AND r.id not in exclusions.excluded_train_ids AND (split(r), r.id) not in union(exclusions.groups[*].members)] ), with normsha(E) ∩ normsha(shots) = ∅ REQUIRED (overlap refused, not dropped); |E| == demo_s64.eval_rows (459) AND class_counts(E) == demo_s64.eval_class_counts ([111, 291, 57])'
    domain: 'the TweetEval stance_abortion validation and train splits, the s64-seed13 selection manifest'
    codomain: 'the demo_s64 eval.jsonl, or a refusal naming the overlapping text or the count mismatch'
    invariants:
      - 'CLAIM: a gate passed on this set certifies margin and calibration on held-out data drawn like the shots, NOT robustness to a shifted input population (eval_set.claim)'
      - 'the set was chosen AFTER the SemEval test split failed the gate twice; spike 027 is the evidence (eval_set.history)'
      - 'order and dedup rule are part of the definition: first occurrence kept in validation-then-train file order'

  shift_probe_reported:
    formula: 'shift metrics (zs and ft macro_f1, f_avg, ece) = recompute(shift-probs.json, shift-zero-shot-probs.json, shift.jsonl labels), each file hash-bound in gate-report shift_probe; gate_clause == false; shift metrics never appear in gate_pass'
    domain: 'a run dir whose data dir carries the optional shift.jsonl'
    codomain: 'reported shift metrics, or a refusal naming an edited field'
    invariants:
      - 'RECOMPUTED in Rust from the hash-bound files; a reported shift metric further than gate_metric_recompute_abs from its recomputation is refused'
      - 'NEVER re-scored (no laya-parity-v1 bound applies to it) and NEVER a gate clause: gate_pass is identical with and without shift.jsonl'
      - 'shift.jsonl text overlapping train.jsonl is refused'

  recipe_before_scores:
    formula: 'mtime_order: write(recipe.json) precedes every eval score; recipe_id = sha256(recipe.json bytes)'
    domain: 'a training run'
    codomain: 'recipe.json on disk and its recipe_id, before any score exists'
    invariants:
      - 'D-04: the recipe is fixed before the run is judged, so it cannot be tuned against eval'
      - 'recipe_id is the sha256 of the exact file bytes; the Rust side never re-serializes to compute it'

  device_recorded:
    formula: 'device_used = device_of(next(model.parameters())) AFTER the move; device_is_cpu = (device_used == "cpu")'
    domain: 'a training run on the first available device of device_order'
    codomain: 'gate-report device_used and device_is_cpu'
    invariants:
      - 'read from the model parameters, NEVER from an env var or from the requested device (D-03, CLAUDE.md Verification #2: prove the mechanism engaged)'
      - 'CPU is allowed and FLAGGED'

  f16_reload_scoring:
    formula: 'forall artefact a in {gate metrics, calibration fit, eval-probs.json, zero-shot-probs.json, probes.json}: a is computed on a checkpoint saved as F16 and RELOADED in fp32'
    domain: 'a training run after fine-tuning'
    codomain: 'every scored file describes the model that is served'
    invariants:
      - 'Pitfall 5: training leaves fp32 weights while D-17 serves F16; scoring the fp32 weights would describe a model that is never served'
      - 'the zero-shot baseline is the declared base loaded the same way'

  early_stopping_train_side:
    formula: 'best_epoch = min { e in [first_candidate_epoch, epochs_run] : m_e < min_{first_candidate_epoch <= j < e} m_j - min_delta (vacuous for e = first_candidate_epoch) AND no later epoch improves on m_e }, m_e = calibration_nll_at_fitted_t on the CALIBRATION slice; stop when e - best_epoch >= patience_epochs or e == max_epochs; shipped weights = weights after best_epoch'
    domain: 'a training run whose recipe.json carries the `early_stopping` object (the early_stopping block)'
    codomain: 'the restored best-epoch weights and the training.stopping record in rl_agent_config.json, both fixed BEFORE any eval probability exists'
    invariants:
      - 'the monitor reads the calibration slice only; eval.jsonl rows never reach the training function, the monitor, the restored epoch or the temperature fit'
      - 'no eval probability is computed before the stopping record and the checkpoint are on disk (ordering assertion in train.py; mtime(checkpoint/model.safetensors) <= mtime(eval-probs.json))'
      - 'epoch 0 (the untrained base) is never a candidate; ties go to the earliest epoch; a non-finite monitor never improves'
      - 'the cosine schedule is the fixed_epochs one over max_epochs; stopping truncates it'
    preconditions:
      - 'split_disjointness holds for the run (the calibration slice is text-group-disjoint from fit)'

  synthetic_not_deployable:
    formula: 'recipe.variant == "synthetic-fixture" implies refuse(pack_for_serving) AND refuse(verify) AND refuse(deploy)'
    domain: 'any run dir or artifact'
    codomain: 'a typed refusal naming the variant'
    invariants:
      - 'the synthetic variant is structurally loadable for tests and never eligible for serving'
      - 'a production recipe whose base differs from the base block is refused the same way'

proof_obligations:

  - type: bound
    property: 'Gate thresholds are read from this contract and a report carrying other thresholds is refused'
    formal: 'forall report r: r.thresholds != (gate_min_macro_f1_margin, gate_max_ece, ece_bins) implies refuse(r)'
    applies_to: all

  - type: soundness
    property: 'pass is decided on recomputed metrics from verified probabilities'
    formal: 'forall run: accepted_pass(run) == gate(recompute(verified(eval_probs)), recompute(verified(zero_shot_probs)))'
    applies_to: all

  - type: bound
    property: 'The applied temperature is within Laya''s clamp range'
    formal: 'calibration_temp_min <= T_applied <= calibration_temp_max'
    applies_to: all

  - type: independence
    property: 'Eval, fit and calibration are text-disjoint'
    formal: 'normsha(eval) ∩ normsha(train) = ∅ AND no normsha group spans fit and calib'
    applies_to: all

  - type: invariant
    property: 'The shipped checkpoint is the declared seed (legacy rule: recipe.json without seed_selection)'
    formal: 'no seed_selection implies shipped.seed == declared_seed'
    applies_to: all

  - type: invariant
    property: 'Under seed_selection the shipped checkpoint is the median-ECE seed by the declared rank key and tie-break, and pass is that seed''s pass (1.4.0)'
    formal: 'seed_selection implies shipped == sort_by((floor(ece_post(s) x rank_scale), s), variance_seeds)[1] AND pass == gate(ft_shipped, zs) AND sha256(checkpoint) == per_seed[shipped].model_safetensors_sha256'
    applies_to: all

  - type: independence
    property: 'The shift probe never enters the gate (1.4.0)'
    formal: 'gate_pass(run) == gate_pass(run without shift.jsonl) AND shift_probe.gate_clause == false'
    applies_to: all

  - type: safety
    property: 'No legacy run is deploy-eligible under 1.4.0'
    formal: 'no seed_selection implies not deploy_eligible (SeedPolicyMissing, decided after the re-scores and the gate)'
    applies_to: all

  - type: independence
    property: 'Early stopping, the restored epoch and the temperature are chosen without eval data'
    formal: 'best_epoch, t_applied = f(train fit rows, calibration slice) AND eval-probs computed after the checkpoint is fixed'
    applies_to: all

  - type: safety
    property: 'A synthetic-fixture run is never deployable'
    formal: 'variant == synthetic-fixture implies not deploy_eligible'
    applies_to: all

falsification_tests:

  - id: FALSIFY-LAYA-GATE-001
    rule: 'The gate is recomputed from verified probabilities and an edited report is refused'
    prediction: 'Editing fine_tuned.macro_f1 in gate-report.json by more than gate_metric_recompute_abs, or flipping `pass`, makes the Rust verifier refuse the run naming the field; the untouched report is accepted.'
    implemented_by: 'plan 08-09 (aprender_decide::verify gate tests: an edited fine-tuned F1, a flipped pass, and a forged zero-shot baseline)'
    test: 'cargo test -p aprender-decide --lib verify::tests::forged_report && cargo test -p aprender-decide --lib verify::tests::pass_disagrees && cargo test -p aprender-decide --lib verify::tests::forged_baseline'
    if_fails: 'The gate trusts reported numbers: an edited report can make an undeployable model deployable.'

  - id: FALSIFY-LAYA-GATE-002
    rule: 'A report whose thresholds differ from this contract is refused'
    prediction: 'A gate-report.json with thresholds.max_ece = 0.2 is refused naming thresholds, even though every metric is otherwise consistent.'
    implemented_by: 'plan 08-09 (aprender_decide::verify gate tests)'
    test: 'cargo test -p aprender-decide --lib verify::tests::threshold_mismatch'
    if_fails: 'The thresholds are no longer the contract''s: a gate chosen after seeing a result can pass (D-07).'

  - id: FALSIFY-LAYA-GATE-003
    rule: 'The ECE matches the house definition on the frozen cases'
    prediction: 'The verifier''s ECE equals aprender::calibration::expected_calibration_error_top_label on every case of scripts/setfit_fixtures/claims_stats/ece_top_label_cases.json, and the Python trainer''s ECE matches within gate_metric_recompute_abs on the synthetic fixture.'
    implemented_by: 'plans 08-08 (Python half: metrics.py --selftest replays every frozen house case to 1e-6, inside just laya-train-selftest) and 08-09 (Rust verifier: recompute_metrics is bit-identical to the house ECE on every frozen case, and within gate_metric_recompute_abs of the frozen reference)'
    test_harness: 'just laya-train-selftest'
    test: 'cargo test -p aprender-decide --lib verify::tests::recompute_matches_house_ece_cases'
    if_fails: 'Two ECE implementations disagree, so the reported and recomputed gate can differ on the same probabilities.'

  - id: FALSIFY-LAYA-GATE-004
    rule: 'The calibration fit stays in [0.5, 5.0] and records the clamp'
    prediction: 'On a synthetic memorised model whose NLL-optimal T exceeds 5, t_fitted == 5.0, clamp_hit == true and ece_post is computed with T = 5.0.'
    implemented_by: 'plan 08-08 (gate.py --selftest bounded-fit cases, inside just laya-train-selftest)'
    test_harness: 'just laya-train-selftest'
    if_fails: 'The reported T is not the served T (Pitfall 6): the gate ECE describes a different model.'

  - id: FALSIFY-LAYA-GATE-005
    rule: 'Split disjointness is text-level and conflicting duplicates are refused'
    prediction: 'A train.jsonl with the same normalized text under two labels is refused; one with duplicate same-label rows keeps them in one side; an eval row equal to a train row after NFC/trim/whitespace collapse is refused.'
    implemented_by: 'plans 08-08 (Python half: data.py --selftest, inside just laya-train-selftest) and 08-09 (aprender_decide::verify check_split)'
    test_harness: 'just laya-train-selftest'
    test: 'cargo test -p aprender-decide --lib verify::tests::split_overlap && cargo test -p aprender-decide --lib verify::tests::conflicting_labels && cargo test -p aprender-decide --lib verify::tests::slice_splits_group'
    if_fails: 'Calibration or eval leaks training text, so the measured calibration and gate are optimistic.'

  - id: FALSIFY-LAYA-GATE-006
    rule: 'recipe.json is written before any score, and the declared seed ships under the legacy rule while the median seed ships under seed_selection'
    prediction: 'The self-test observes recipe.json on disk before the first eval score is computed. A LEGACY single-seed run (no seed_selection) ships seed 13. A --seeds 3 run under seed_selection (1.4.0) ships the median seed by seed_policy.rank_rule, its checkpoint/model.safetensors byte-identical to that seed''s recorded per_seed model_safetensors_sha256. RETIRED CLAUSE (2026-09-27, before any s64 gate run; D-ITEM-08-14-B): the 1.x clause "with legacy variance seeds 13/17/23 the shipped checkpoint is seed 13 even when another seed scores higher" is no longer predicted. No code path can exercise it: since 1.4.0 the trainer never writes a legacy MULTI-seed run (every three-seed run carries seed_selection), and a legacy run carries no per-seed record from which a verifier could tell which seed it shipped. It also decides nothing a verifier accepts: every legacy run is refused SeedPolicyMissing once its gate passes (FALSIFY-LAYA-GATE-012). The 1.x runs that exercised it (plan 08-08) remain recorded evidence of the 1.x rule; the legacy rule itself stays declared (declared_seed_ships).'
    implemented_by: 'plan 08-08 (lifecycle.py: log + mtime order, and the LEGACY single-seed runs shipping seed 13 with no seed_selection, inside just laya-train-selftest) and plan 08-14 (lifecycle.py check_median_run, same harness: a --seeds 3 run under seed_selection ships gate.select_median_seed of its own per_seed rows, exactly one model.safetensors whose sha256 is that seed''s model_safetensors_sha256, seed 13 trained bit-identically to the single-seed run, and — when 13 is the median — the single-seed run''s checkpoint tree). The retired legacy multi-seed clause (see the prediction) has no leg; the legacy rule''s verifier side is FALSIFY-LAYA-GATE-012 (plan 08-15)'
    test_harness: 'just laya-train-selftest'
    if_fails: 'The recipe or the shipped seed was chosen after reading eval (D-04 / D-08).'

  - id: FALSIFY-LAYA-GATE-007
    rule: 'The device is read from the parameters and every score comes from the F16 reload'
    prediction: 'Forcing the CPU path yields device_used == "cpu" and device_is_cpu == true regardless of any env var; the eval probabilities equal those of a separate F16 reload within pack_rescore_probs_abs.'
    implemented_by: 'plan 08-08 (lifecycle.py: forced --device cpu recorded as cpu, and eval-probs.json re-scored by a separate F16 reload within pack_rescore_probs_abs, inside just laya-train-selftest)'
    test_harness: 'just laya-train-selftest'
    if_fails: 'The report labels a run by intent rather than mechanism, or scores a model that is never served (Pitfall 5).'

  - id: FALSIFY-LAYA-GATE-008
    rule: 'A synthetic-fixture run is refused by pack-for-serving, verify and deploy'
    prediction: 'pack_laya verify on a synthetic-fixture run dir refuses naming the variant; the same run is accepted by the structural loader used in tests.'
    implemented_by: 'plan 08-09 (aprender_decide::verify verify_run)'
    test: 'cargo test -p aprender-decide --lib verify::tests::synthetic_refused'
    if_fails: 'A zero-epoch fixture on a tiny synthetic base can be served as a decision model.'

  - id: FALSIFY-LAYA-GATE-009
    rule: 'Early stopping is decided on the calibration slice alone, before any eval score, and restores the best epoch'
    prediction: 'On a synthetic monitor trace the rule picks the earliest epoch within min_delta of the minimum, stops patience_epochs after it, and never picks epoch 0 or a non-finite epoch; a real early-stopping run logs its STOP line before CHECKPOINT COMPLETE and SCORING START, and checkpoint/model.safetensors is not newer than eval-probs.json.'
    implemented_by: 'plan 08-08 (gate.py --selftest synthetic monitor trace; lifecycle.py STOP-before-SCORING and mtime order; inside just laya-train-selftest)'
    test_harness: 'just laya-train-selftest'
    if_fails: 'The shipped epoch was chosen with eval data or after eval was scored (D-04 / D-07), or the restored weights are not the best epoch.'

  - id: FALSIFY-LAYA-GATE-010
    rule: 'The D-19 demo runs are refused by pack and by verify on the exact bytes, each with its documented refusal, writing nothing'
    prediction: 'For each demo.fail_closed_vectors entry, identified by sha256(recipe.json): pack-for-serving and pack_laya verify on a transient low-level pack of the same run refuse with the SAME documented refusal and write nothing. early_stopping 3d4b91daf86772bcb23e5342c2dff4bb6467f5d9f254f7833ac7f61a8f2f5375: GateFailed naming ONLY the ece_post clause (exit 3), after all 280 eval rows of the packed bytes and of the base re-score within pack_rescore_probs_abs with argmax 280/280, the recomputed ece_post within gate_metric_recompute_abs of the reported 0.2224 and the margin clause passing; the verify-side artifact sha256 equals the pack-side one. fixed_epochs d0f4e40d39425e68d503f557f4f660eb9a73a4fb258da01f777b6f49362bcf20: RescoreDrift on the FINE-TUNED re-score (exit 2), the same first row and max_abs on both paths; its gate is not reached. User decision option A (2026-09-26, debug session laya-rescore-drift): pack_rescore_probs_abs stays 1.0e-5, and torch''s own fp32 probabilities for this checkpoint are up to 3.7e-5 from a float64 reference, so no fp32 port meets the bar on it; the refusal is still fail-closed. A vector with no declared refusal fails the test. UNDER 1.4.0 THE REFUSALS ARE UNCHANGED: neither run dir carries rescore-noise.json, so both re-scores are held to the laya-parity-v1 A1 absent-record floor (1.0e-5); neither recipe.json carries seed_selection, so both are judged under seed_policy.legacy_rule, whose SeedPolicyMissing refusal comes only after the re-scores and the gate and is therefore never reached by either vector (demo.fail_closed_rule, demo.vectors_scope).'
    implemented_by: 'plan 08-09 (tests/fail_closed_vectors.rs; armed by LAYA_MODEL_DIR + LAYA_FAIL_CLOSED_VECTORS=1 with the gitignored run dirs, SKIP elsewhere, so CI compiles it only)'
    test: 'cargo test -p aprender-decide --release --test fail_closed_vectors demo_vectors_are_refused_fail_closed'
    if_fails: 'A demo run that failed the gate could be packed, verified as eligible or served; or it is refused for a reason nobody declared (for example a re-score bar that a 1-ULP toolchain change moved), which is fail-closed but no longer demonstrates the rule. Never widen a tolerance to restore the expected refusal: record the new refusal and decide it (see the calibration spike todo).'

  - id: FALSIFY-LAYA-GATE-011
    rule: 'The shipped seed is the median-ECE seed by the declared rank key and tie-break, re-derived in Rust'
    prediction: 'With three distinct ece_post values the seed of the middle one ships; with two seeds sharing floor(ece_post x 10000) the smaller seed ranks first and the median follows from that order; a gate report whose seeds.shipped names a non-median seed is refused naming `shipped`; a per_seed metric (ece_post, macro_f1) edited beyond gate_metric_recompute_abs of its recomputation from seeds/seed-<s>/eval-probs.json is refused naming the seed and field; a checkpoint whose sha256 differs from the shipped seed''s model_safetensors_sha256 is refused.'
    implemented_by: 'Python half, plan 08-14, inside just laya-train-selftest: gate.py --selftest median-ECE cases (distinct ECEs 0.15 / 0.05 / 0.12 ship the 0.12 seed; 0.10009 / 0.10001 share rank key 1000 and the smaller seed ranks first; an exact tie; the declared seed as median; a non-finite ece_post, N = 2, N = 0 and a repeated seed refused; a failing median fails the gate while another seed passes; verify_report refuses a report shipping a non-median seed, an edited seeds.shipped, or a shipped row whose pass disagrees with the top-level gate) and lifecycle.py check_median_run (a tiny three-seed run ships select_median_seed of its own per_seed rows; its checkpoint sha256 and eval-probs.json bytes are that row''s). Rust half, plan 08-15: aprender_decide::verify check_seed_selection / select_median_seed lib tests (a three-seed copy shipping its median verifies; files consistent with shipping the lowest-ECE seed refused naming it and the median; shared rank keys ordered by the smaller seed, and an even, empty, repeated or non-finite seed set refused; a per_seed ece_post edited by 1e-3 refused naming the seed; a shipped row whose model sha256 is not checkpoint/model.safetensors refused), each guard shown to discriminate by mutation; tests/python_records.rs requires Rust''s median of its own recomputed ECEs to equal a Python-written run''s shipped seed.'
    test_harness: 'just laya-train-selftest'
    test: 'cargo test -p aprender-decide --lib verify::tests::seed_median_ships && cargo test -p aprender-decide --lib verify::tests::seed_shipped_not_median && cargo test -p aprender-decide --lib verify::tests::seed_tie_break_smaller_seed && cargo test -p aprender-decide --lib verify::tests::seed_metric_forged && cargo test -p aprender-decide --lib verify::tests::seed_checkpoint_not_shipped'
    if_fails: 'The shipped seed can be chosen by something other than the declared rule (for example the best draw), or a report can name a seed the probabilities do not support.'

  - id: FALSIFY-LAYA-GATE-012
    rule: 'A legacy run (no seed_selection) is never deploy-eligible, and its gate outcome is still reported first'
    prediction: 'A run dir whose gate passes but whose recipe.json carries no seed_selection is refused SeedPolicyMissing; a legacy run whose gate fails is still refused GateFailed naming its clauses (the seed-policy check comes after the re-scores and the gate).'
    implemented_by: 'plan 08-15 (aprender_decide::verify lib tests: a legacy copy whose gate passes is refused SeedPolicyMissing, exit 2, and the same copy with a drifted probability is refused RescoreDrift instead, so the policy refusal follows the re-scores; a legacy copy whose gate fails is refused GateFailed, exit 3; moving the refusal before the gate turns the second test RED)'
    test: 'cargo test -p aprender-decide --lib verify::tests::legacy_policy_refused_after_gate_pass && cargo test -p aprender-decide --lib verify::tests::legacy_gate_fail_keeps_gate_failed'
    if_fails: 'A single-seed MPS draw — which spike 027 showed can flip FAIL to PASS — could be deployed without the median rule, or the refusal order hides a failed gate behind a policy error.'

  - id: FALSIFY-LAYA-GATE-013
    rule: 'The held-out eval set is reproduced by rule and the shift probe is reported, recomputed and never a gate clause'
    prediction: 'The demo_rule rebuilds exactly 459 rows with class counts [111, 291, 57] from the pinned TweetEval splits and the s64-seed13 manifest, and refuses an input in which a held-out row''s text overlaps a shot; a gate report whose shift_probe metric is edited beyond gate_metric_recompute_abs is refused naming the field; gate_pass is identical with and without shift.jsonl.'
    implemented_by: 'Python half, plan 08-14, inside just laya-train-selftest: data.py --selftest held-out cases on a synthetic manifest (a shot, an excluded train id and a validation exclusion-group member dropped; a normalized-text overlap with a shot REFUSED; a duplicate kept once with validation order winning; the class counts) and, when the gitignored TweetEval splits are present, the demo_rule rebuilt from them through prepare_stance.py --cell s64 (459 rows, [111, 291, 57]; an explicit SKIP otherwise); lifecycle.py check_shift_probe (a tiny three-seed run with and without shift.jsonl decides an identical gate — pass, margin, zero_shot, fine_tuned, calibration, seeds —, only the shift run carries shift_probe with gate_clause false and the two hash-bound shift files, and a shift row equal to a train row is refused before anything is written). Rust half, plan 08-15: aprender_decide::verify check_shift_probe lib tests (a copy with a shift probe verifies with recomputed gate metrics identical to the same copy without it; shift_probe.fine_tuned.ece_post edited by 0.01 refused ShiftProbeMismatch; a report naming a probe whose data dir has no shift.jsonl refused).'
    test_harness: 'just laya-train-selftest'
    test: 'cargo test -p aprender-decide --lib verify::tests::shift_probe_metric_forged && cargo test -p aprender-decide --lib verify::tests::shift_file_missing'
    if_fails: 'The eval set is not the declared one (a post-hoc choice could slip in), or the shift probe silently became a gate clause or an unverified number.'

  - id: FALSIFY-LAYA-GATE-014
    rule: 'Pack and verify decide exactly the recorded outcome of the one declared s64 run, on its exact bytes'
    prediction: 'On the run dir of the one declared demo_s64 run, pack-for-serving and pack_laya verify decide exactly demo_s64.outcome: deploy_eligible true on gate_pass; GateFailed naming the recorded clauses on gate_fail; the recorded refusal on pack_refused. A mismatch between the verifier''s decision and the recorded outcome fails the test.'
    implemented_by: 'plan 08-15 wrote the env-gated test (crates/aprender-decide/tests/demo_run.rs: armed by LAYA_MODEL_DIR + LAYA_DEMO_RUN=1, SKIP otherwise, so CI compiles it only; it reads demo_s64 and, while outcome is pending, prints that SKIP and passes); plan 08-16 arms it after writing demo_s64.outcome and outcome_record.'
    test: 'cargo test -p aprender-decide --release --test demo_run declared_demo_run_matches_its_outcome_of_record'
    if_fails: 'The recorded outcome of the declared run and what the shipped bytes actually do disagree: the record describes something that is not deployed.'

