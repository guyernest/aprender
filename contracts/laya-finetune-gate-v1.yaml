contract: laya-finetune-gate
metadata:
  version: 2.0.0
  created: '2026-09-25'
  author: PAIML Engineering
  kind: kernel
  description: >
    THE TRAINING-SIDE CLAIMS of the Laya decision model (Phase 8, D-03..D-08) and the D-19 demo
    cell: the device rule, the declared base, the fine-tune recipe, the task and training-row
    inputs, the calibration fit, the pre-declared quality gate and the seed policy — plus the
    schemas of every file a training run writes, so the Python writer (`scripts/laya_train`) and
    the Rust reader/verifier (`aprender-decide`, `deny_unknown_fields`) implement ONE schema.

    DECLARED BEFORE ANY RUN IS READ (D-07). Every threshold here is committed in plan 08-01, before
    any `models/decide/` run directory exists; the trainer and the verifier READ them from this
    file at run time and never write them as literals. A threshold chosen after seeing a result is
    not a gate. Moving one after a run has been read is a `pv diff`-visible claims change that
    invalidates the recorded evidence.

    AMENDMENT 1.1.0 (2026-09-25, after the D-19 fixed_epochs demo FAILED the gate on ECE). Additive
    only: a second declared stopping rule (`early_stopping`), the optional recipe.json field that
    names it, and the equation / test that bind it. No threshold, calibration bound, seed, data
    rule or schema field of 1.0.0 moved; the failing fixed_epochs run remains valid evidence.

    AMENDMENT 1.2.0 (2026-09-26, after the D-19 early_stopping demo ALSO failed the gate on ECE).
    Records the demo's outcome of record, nothing else: the D-19 demo FAILED the unchanged gate under
    both declared recipe_ids, and by user decision (2026-09-26, option 3) both runs are kept as
    FAIL-CLOSED TEST VECTORS that pack/verify must refuse (`demo.fail_closed_vectors`). The D-18 live
    deploy of the stance model is DEFERRED until a declared run passes this gate. No threshold,
    calibration bound, seed, recipe value, data rule or schema field moved; `gate_max_ece` stays 0.10.

    AMENDMENT 1.4.0 (2026-09-27, user decision option 1 from spikes 027/028; declared BEFORE any s64
    gate run). NAMING: the approved plan set calls this amendment "1.4.0" and every "1.4.0" in this
    file, laya-parity-v1 and decide-apr-v1 means it; `pv diff` classified it MAJOR (amended
    gate_pass / declared_seed_ships formulas), so it is published as metadata.version 2.0.0. Three changes, taken together by the user, each visible in `pv diff` before a run is
    read. (A2, the claim) The gate now certifies margin and calibration on held-out data drawn like
    the tenant's shots. It does NOT certify robustness to a shifted input population. This eval set
    was chosen AFTER the SemEval-2016 test split failed the gate under both 1.x recipes; spike 027
    measured the cause as the SemEval train-to-test shift (the same s64 early-stopping checkpoints
    at their own slice T: ECE 0.051 to 0.069 on 459 in-distribution rows, 0.096 to 0.139 on the
    test split). The test split is kept as a REPORTED shift probe so the shift stays visible
    (`eval_set`). (A3, the seeds) Production runs train seeds 13/17/23 on the same data, split and
    recipe; the median-ECE seed ships, ranked by floor(ece_post x 10000) with ties to the smaller
    seed, and the gate passes only if that seed's run passes BOTH clauses; all three runs are
    reported; the median is selected WITH eval labels and says so (`seed_policy`). (A1, the
    re-score bar) The pack/verify re-score of `gate_pass`'s domain is now laya-parity-v1 2.0.0's
    noise-referenced bound(c, s), recomputed in Rust from the hash-bound `rescore-noise.json`
    (`rescore_noise_schema`). The amended D-19 cell is the NEW `demo_s64` block; the `demo` block
    stays the s16 record of 1.2.0 with every value unchanged. NO threshold, calibration bound,
    recipe value or early-stopping value moved: gate_max_ece 0.10, gate_min_macro_f1_margin 0.05,
    T in [0.5, 5.0]. Every key an existing reader consumes keeps its name and 1.x meaning; the
    amendments are added beside them.

    THE GATE IS DECIDED ON RECOMPUTED METRICS, NOT REPORTED ONES. A gate report is a file a
    training run wrote; an edited report must not pass. So the metrics that DECIDE pass are
    recomputed in Rust (plan 08-09) from `eval-probs.json` and `zero-shot-probs.json`, after every
    probability in those files has been verified within laya-parity-v1 `pack_rescore_probs_abs` of
    the Rust re-score of the packed artifact and of the declared base respectively (argmax exact).
    A reported metric further than `gate_metric_recompute_abs` from its recomputation, or a reported
    `pass` that disagrees with the recomputed one, is refused. The zero-shot probabilities are
    RETAINED as a file for exactly this reason: a baseline that exists only as a reported number can
    be edited.

    THE ECE IS THE HOUSE ECE (OPS-03). `ece_top_label` is aprender-core's
    `calibration::expected_calibration_error_top_label` (contracts/calibration-v1.yaml), floor
    binning with a top-bin clamp. Recorded deviation: spike 024's `fewshot015.metrics` bins
    right-closed, `(lo, hi]`; the two differ only for a confidence exactly on a bin edge. One Rust
    ECE implementation outweighs byte-matching an informational spike number.

    TWO RECIPE VARIANTS, ONE DEPLOYABLE. `production` is the only variant that can be packed for
    serving, verified or deployed. `synthetic-fixture` exists so the lifecycle can be exercised on a
    tiny synthetic base in tests; it is structurally loadable and REFUSED by every
    pack-for-serving, verify and deploy path (`synthetic_not_deployable`).

    PROVABILITY HONESTY. `cargo-kani` is not installed in this repository and there is not one
    `#[kani::proof]` harness anywhere under `crates/`. The `kani_harnesses:` entries are DECLARED and
    NOT EXECUTED; each names the runnable test that is the actual evidence.

    ANNOTATION HONESTY. `#[contract]` is METADATA-ONLY in this repository (see setfit-apr-v1). The
    enforcement mechanism for everything below is the named test, never the annotation.

    BINDING HONESTY, AND STAGED TEST REFERENCES. Every equation Rust can re-verify is bound to the
    RUST verifier (`aprender_decide::verify`), because Rust lib tests are what CI runs; the
    Python-only training equations are bound to the `laya-train-selftest` justfile recipe and say in
    their binding notes that the recipe runs locally, not in CI. All are `status: pending` except
    `ece_top_label`, whose implementation already exists. No falsification test below cites a test
    that does not exist yet (CI's strict-binding gate starts a new contract at zero): each carries a
    prose `implemented_by:`, and the implementing plan adds the `test:` / `test_harness:` line in the
    same commit as the test.
  references:
    - '.claude/skills/spike-findings-aprender/references/laya-decision-model.md — full fine-tune quality (spike 024) and the recipe this contract fixes.'
    - '.claude/skills/spike-findings-aprender/sources/024-laya-vs-kev-few-shot/tools/ft_laya.py — the recipe (AdamW 2.5e-5 / 1.0e-4, cosine to 1e-6, batch 8, clip 1.0, proper reward 0.75 / 1.0).'
    - '.claude/skills/spike-findings-aprender/sources/024-laya-vs-kev-few-shot/tools/fewshot015.py — the spike metrics (macro-F1, F_avg over against/favor, 15-bin ECE).'
    - 'contracts/calibration-v1.yaml and crates/aprender-core/src/calibration.rs — expected_calibration_error_top_label, the house ECE; frozen cases scripts/setfit_fixtures/claims_stats/ece_top_label_cases.json.'
    - 'contracts/tweet-eval-stance-benchmark-v1.yaml — dataset identity, F_avg and the seed set the demo cell uses.'
    - 'benchmarks/tweeteval-stance/selections/s16-seed13/selection-manifest.json — the D-19 demo selection (label_names none, against, favor; 16 shots/class; root_seed 13).'
    - 'Laya @ 4066d5d laya/common.py:376-377 — TEMP_MIN 0.5 / TEMP_MAX 5.0, applied by clamp_temperature at every load (RESEARCH Pitfall 6).'
    - 'Guo et al. (2017), On Calibration of Modern Neural Networks — temperature scaling by NLL.'
  depends_on:
    - calibration-v1
    - tweet-eval-stance-benchmark-v1
    - laya-parity-v1

# FLAT scalars only (the decide-tool-boundary-v1 rule): every value here is read by one key
# lookup, and no nested value exists that nothing validates. Every structured declaration is a
# TOP-LEVEL key beside this block (the `door_surface:` precedent in forecast-tool-boundary-v1).
constants:
  # ---- the gate (D-07), RESEARCH A6 / A7 ----
  gate_min_macro_f1_margin: 0.05
  gate_max_ece: 0.10
  # How far a REPORTED metric may differ from the one Rust recomputes (plan 08-09).
  gate_metric_recompute_abs: 1.0e-5
  ece_bins: 15
  # ---- calibration (D-06), Laya's TEMP_MIN / TEMP_MAX (Pitfall 6) and RESEARCH A9 ----
  calibration_temp_min: 0.5
  calibration_temp_max: 5.0
  calibration_slice_fraction: 0.25
  calibration_slice_min_per_class: 2
  # ---- seeds (D-08) ----
  declared_seed: 13

# ---------------------------------------------------------------------------------------------
# Structured declarations. Top-level keys: pv's `Contract` is not deny_unknown_fields, so these
# validate and are read by the trainer and the Rust verifier by name.
# ---------------------------------------------------------------------------------------------

seed_policy:
  declared_seed: 13
  variance_seeds: [13, 17, 23]
  rule: 'TWO RULES (1.4.0; D-08 as amended 2026-09-27). (1) SEED SELECTION, required for production: when recipe.json carries `seed_selection`, the seeds variance_seeds (13, 17, 23) all train on the same data, split and recipe, the MEDIAN-ECE seed ships per rank_rule, and the gate passes per pass_rule. (2) LEGACY (1.x), when recipe.json carries no `seed_selection`: the shipped checkpoint is ALWAYS the declared seed; other seeds are run only to report variance (`variance-report.json`), never to select a checkpoint; such a run is never deploy-eligible under 1.4.0 (legacy_rule). Gate-report `seeds.label` is a literal naming WHAT SHIPS: "single seed" when one seed ran; under seed selection "median-ECE seed of N seeds" (the shipped run is ONE seed, the median, never a mean); a legacy (1.x) multi-seed run keeps its 1.x literal "mean ± sd over N seeds". variance-report.json `label` stays "mean ± sd over N seeds" under both rules, because that file does report the mean and sd (label settled 2026-09-27, before any s64 gate run; D-ITEM-08-14-A).'
  # ---- A3 (1.4.0, 2026-09-27): median-ECE seed selection. Read by scripts/laya_train/gate.py
  # select_median_seed (plan 08-14) and aprender_decide::verify check_seed_selection (plan 08-15,
  # authoritative): one declared rule implemented twice.
  selection: median_ece
  rank_scale: 10000
  tie_break: smaller_seed
  production_seeds_required: 3
  rank_rule: 'for each seed s, rank_key(s) = floor(ece_post(s) x rank_scale) as an integer, ece_post(s) being that seed''s post-calibration house ECE on the gate eval set at its own applied T; order the seeds by (rank_key ascending, seed ascending); the SHIPPED seed is the element at 0-based index (N - 1) / 2 = 1 for N = 3'
  pass_rule: 'the gate PASSES only if the shipped (median) seed''s run passes BOTH clauses: ft.macro_f1 - zs.macro_f1 >= gate_min_macro_f1_margin with the shared zero-shot baseline, and ece_post <= gate_max_ece'
  report_rule: 'all three runs are reported, in gate-report `seeds.per_seed` (seed order) and in variance-report.json; a non-median seed''s numbers never enter gate_pass'
  retention_rule: 'every seed trains in `seeds/seed-<s>/`; after selection the median seed''s checkpoint becomes `checkpoint/` and the others'' checkpoints are deleted; every seed''s `seeds/seed-<s>/eval-probs.json` is kept and hash-bound (per_seed eval_probs_sha256); the non-shipped seeds are RECOMPUTED in Rust from those files but NOT re-scored'
  honesty: 'the median is selected WITH eval labels. Median-of-3 is not best-of-3: the shipped run''s ECE is the middle draw, not the minimum, so the report is not optimistically biased the way a best-seed choice is — but it IS a selection on the gate eval set and is recorded as one. Chosen because spike 027 measured MPS training as not bitwise reproducible: one replicate turned a FAIL into a PASS, ECE moving by up to 0.048'
  why_quantized: 'Python and Rust compute the same ECE from the same probabilities to well under 1e-12; ranking on the 1e-4 grid makes both sides order the seeds identically except for a value within that distance of a grid line, which Rust refuses rather than guesses'
  legacy_rule: 'a recipe.json without `seed_selection` is judged under the 1.x rule — the declared seed ships — and is NEVER deploy-eligible under 1.4.0: verify refuses it with SeedPolicyMissing, but only AFTER the re-scores and the gate, so a legacy run whose gate fails still reports GateFailed'

eval_set:
  # ---- A2 (1.4.0, 2026-09-27, user decision option 1): what the gate's eval set is, and what a
  # passing gate therefore claims. Declared BEFORE any s64 data dir or run exists (D-07).
  claim: 'The gate now certifies margin and calibration on held-out data drawn like the tenant''s shots. It does NOT certify robustness to a shifted input population.'
  history: 'This eval set was chosen AFTER the SemEval-2016 test split failed the gate twice (1.x: fixed_epochs d0f4e40d… ece_post 0.3773; early_stopping 3d4b91da… ece_post 0.2224). Spike 027 (.planning/spikes/027-laya-calibration-slice-and-tcap) measured the cause as the SemEval train-to-test shift, not the recipe: the same s64 early-stopping checkpoints at their own slice-fitted T score ECE 0.051 to 0.069 on 459 in-distribution held-out rows and 0.096 to 0.139 on the test split. The choice is therefore informed by those failures and is recorded as a claims change, not as a tuning step.'
  generic_rule: 'eval.jsonl is REQUIRED (D-06) and must be held-out data drawn like train.jsonl; the trainer cannot check the distribution, so the claim is only as good as the tenant''s split'
  demo_rule: 'the demo_s64 eval set, as a rule: TweetEval stance_abortion `validation` rows followed by `train` rows (file order), keeping every row whose id is NOT a shot of the s64-seed13 manifest (payload.ordered_examples), NOT in payload.exclusions.excluded_train_ids, and NOT a member of any payload.exclusions.groups[*].members (each member a [split, id] pair, e.g. [validation, validation:3]); text overlap with the shots under nfc-trim-ws-v1 is REFUSED; duplicates by nfc-trim-ws-v1 are dropped keeping the first occurrence in that order. Expected: 459 rows with class counts [111, 291, 57] in criteria order [none, against, favor], as spikes 027 (diagnose_indist.py) and 028 (build_heldout.py) both measured'
  shift_probe_rule: 'an OPTIONAL data-dir file `shift.jsonl` with the train_row schema, scored with the shipped checkpoint and the declared base AFTER the gate is decided; reported in gate-report `shift_probe` with `gate_clause: false`; RECOMPUTED in Rust from its hash-bound probability files but never re-scored and never a gate clause; text overlap with train.jsonl is refused'
  demo_shift_probe: 'the TweetEval stance_abortion test split (SemEval-2016 test), 280 rows — the 1.x gate eval set, kept visible as the shift probe'

recipe:
  # D-04: fixed to the spike-024 values. Any change is a new recipe_id.
  optimizer: adamw
  encoder_lr: 2.5e-5
  head_lr: 1.0e-4
  eta_min: 1.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  batch_size: 8
  proper_reward_w_sph: 0.75
  proper_reward_w_rps: 1.0
  loss: 'cross_entropy + (-proper_reward(softmax(z / T), onehot, w_sph, w_rps)).mean()'
  epochs_at_most_16_per_class: 12
  epochs_above_16_min: 4
  epochs_above_16_max: 12
  schedule: 'cosine annealing from each group lr to eta_min over epochs * ceil(n_fit / batch_size) steps'
  epoch_rule: 'shots_per_class <= 16 -> 12 epochs; above 16 -> an epoch count in [4, 12] declared in recipe.json before training'
  # How training stops. Two declared stopping rules over the SAME loop and values above:
  #   fixed_epochs    run exactly `epochs` epochs and ship the last (the spike-024 recipe; recipe.json
  #                   carries no `early_stopping` key). D-19 demo run with it: recipe_id
  #                   d0f4e40d39425e68d503f557f4f660eb9a73a4fb258da01f777b6f49362bcf20, GATE FAIL
  #                   (margin 0.1299 passes; ece_post 0.3773 > gate_max_ece, T clamped at 5.0).
  #   early_stopping  the `early_stopping:` block below; `epochs` becomes the MAXIMUM.
  # The default for production runs is early_stopping (declared 2026-09-25, see that block's history).
  stopping_rules: [fixed_epochs, early_stopping]
  stopping_default: early_stopping

early_stopping:
  # D-04 / D-07 discipline. DECLARED 2026-09-25, AFTER the fixed_epochs demo run's gate report was read
  # (recipe_id d0f4e40d…: GATE FAIL on ECE because 12 epochs memorise the shots, ce_last 0.0) and
  # BEFORE any early-stopping run existed. It is therefore informed by that one result and is recorded
  # as a NEW declared recipe (a new recipe_id), never as a tweak of the old one. The gate thresholds,
  # the calibration bounds, the seeds and the data are UNCHANGED; the fixed_epochs run stays a valid,
  # identifiable fail-closed test vector. One declared attempt: if this recipe also fails the gate,
  # the run halts for a human decision rather than trying another rule.
  name: early-stopping-calibration-nll-v1
  max_epochs: 'the recipe epoch count (epochs_at_most_16_per_class = 12 at <= 16 shots/class; the declared --epochs above 16); recipe.json `epochs` records this MAXIMUM'
  monitor: calibration_nll_at_fitted_t
  monitor_formula: 'm_e = mean_i -log softmax(z_i / T*_e)[y_i] over the CALIBRATION slice rows i, where z are the model''s logits after epoch e and T*_e = fit_temperature(z, y, calibration_temp_min, calibration_temp_max) (equation calibration_fit_bounded) — the NLL the served, bounded temperature can reach'
  monitor_why: 'The gate fails a model the bounded temperature cannot calibrate (T capped at 5.0). NLL at the best servable T measures exactly that, and it is a proper score; ECE over 12 rows in 15 bins is too coarse to rank epochs.'
  mode: min
  eval_every_epochs: 1
  eval_point: 'after the last optimizer and scheduler step of each epoch'
  first_candidate_epoch: 1
  first_candidate_why: 'epoch 0 is the untrained base, which is the zero-shot baseline itself (margin 0); it is never a candidate'
  patience_epochs: 3
  min_delta: 0.001
  improvement_rule: 'epoch e improves iff m_e < m_best - min_delta (strict); a non-finite m_e never improves'
  stop_rule: 'stop after epoch e when e - best_epoch >= patience_epochs, or at max_epochs'
  restore: best
  restore_rule: 'the weights after best_epoch are restored (an exact copy taken when that epoch improved), then saved F16 as the shipped checkpoint'
  tie_break: earliest
  tie_break_rule: 'a later epoch must beat the best by MORE than min_delta, so among epochs within min_delta of each other the earliest is kept'
  schedule: 'UNCHANGED: cosine over max_epochs * ceil(n_fit / batch_size) steps, as fixed_epochs; stopping truncates it, it is never re-planned'
  monitor_precision: 'fp32 weights in eval mode on the training device, no grad, batched by recipe.batch_size with the training collate — a SELECTION signal only. Every REPORTED score (calibration fit, gate metrics, eval / zero-shot / probe files) is still computed on the F16 reload (f16_reload_scoring); T*_e is not the reported t_fitted.'
  data_rule: 'The calibration slice is the SAME text-group-disjoint slice (split_disjointness, declared_seed) used for the temperature fit, and the ONLY data the monitor reads. It is used twice (stopping and T); both uses are train-side. eval.jsonl NEVER influences stopping, the restored epoch or T: the trainer never passes eval rows to training, and no eval probability is computed before the checkpoint is fixed (enforced by an ordering assertion in train.py: the stopping record and checkpoint/model.safetensors precede eval-probs.json).'
  record: 'checkpoint/rl_agent_config.json `training.stopping` {rule, monitor, per_epoch [{epoch, monitor, t_star}], best_epoch, epochs_run, reason} — provenance Laya and the Rust AgentConfig reader ignore; the gate-report schema is unchanged'
  recipe_json_field: 'recipe.json `early_stopping` {monitor, mode, eval_every_epochs, first_candidate_epoch, patience_epochs, min_delta, restore, tie_break}, copied from this block before training — so the recipe_id differs from every fixed_epochs recipe_id'

recipe_variants:
  production:
    base: 'must equal the base: block below (repo, revision, checkpoint, sha256)'
    shots_epochs_seed: 'per the recipe rules; seed == declared_seed for the shipped checkpoint'
    deployable: true
    note: 'The ONLY variant that can be packed for serving, verified by pack_laya verify, or deployed.'
  synthetic-fixture:
    base: 'checkpoint `tiny-synthetic` with its own sha256 recorded in recipe.json'
    shots_epochs_seed: 'shots and epochs may be 0 (or 1 for the lifecycle self-test); any seed'
    deployable: false
    note: 'Structurally loadable for tests (plan 08-02 fixtures); REFUSED by every pack-for-serving, verify and deploy path (equation synthetic_not_deployable).'

base:
  # D-04: the declared base, pinned.
  family: laya
  repo: convaiinnovations/laya
  revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
  checkpoint: en-root
  model_safetensors_sha256: 891102d372688fc2a094dac56a384bc537b87c63f21f9f3dac0be2b7cbc8d86c
  laya_git: 4066d5d5fbf08b66c6757ddeedbd797bd7655bc0

# D-03: the first available device in this order is used; the device actually used is read back
# from the model parameters (equation device_recorded). CPU is allowed and FLAGGED.
device_order: [mps, cuda, cpu]

demo:
  # D-19, RESEARCH Open Q4 resolution.
  dataset: 'TweetEval stance_abortion'
  criteria_order: [none, against, favor]
  shots_per_class: 16
  epochs: 12
  # The demo's stopping rule. fixed_epochs was run first (recipe_id d0f4e40d…, GATE FAIL, kept as a
  # fail-closed test vector); the second declared attempt used early_stopping (the early_stopping
  # block, max 12) and also FAILED (recipe_id 3d4b91da…). See `outcome` below (1.2.0).
  stopping: early_stopping
  superseded_run: 'fixed_epochs, recipe_id d0f4e40d39425e68d503f557f4f660eb9a73a4fb258da01f777b6f49362bcf20: margin 0.1299, ece_post 0.3773, t_applied 5.0 (clamp_hit) — GATE FAIL'
  declared_seed: 13
  variance_seeds: [13, 17, 23]
  selection: benchmarks/tweeteval-stance/selections/s16-seed13/selection-manifest.json
  eval_split: test
  eval_rows: 280
  spike_baseline_f_avg: '0.538 ± 0.017 (spike 024, 16 shots/class) — INFORMATIONAL, explicitly NOT a gate'
  note: 'The 25 % calibration slice leaves 12 fit shots/class (16 - 4), so an F_avg below the spike''s is expected (RESEARCH A9). The gate is gate_pass, not this number.'
  # ---- D-19 OUTCOME OF RECORD (1.2.0; user decision 2026-09-26, option 3: re-scope D-07/D-18 for the demo) ----
  # Recorded AFTER both runs were read. It changes no threshold: it states what the unchanged gate
  # decided and what downstream plans must do with those runs.
  outcome: gate_fail
  outcome_rule: 'The D-19 demo FAILED gate_pass under BOTH declared recipe_ids on the same data (task/train/eval sha256 identical), seed 13, base above. In both runs the margin clause passes and the ece_post clause fails. There is NO passing demo run; a passing demo is PENDING the calibration spike (pass_pending).'
  fail_closed_vectors:
    - 'fixed_epochs: recipe_id d0f4e40d39425e68d503f557f4f660eb9a73a4fb258da01f777b6f49362bcf20, run dir models/decide/tweet-stance-16-fixed-epochs/ (gitignored) — zs macro_f1 0.3402, ft macro_f1 0.4701, margin 0.1299 (pass), ece_post 0.3773 (FAIL > 0.10), t_fitted = t_applied = 5.0, clamp_hit true'
    - 'early_stopping: recipe_id 3d4b91daf86772bcb23e5342c2dff4bb6467f5d9f254f7833ac7f61a8f2f5375, run dir models/decide/tweet-stance-16/ (gitignored) — best epoch 4 of 12 (stopped at 7), zs macro_f1 0.3402, ft macro_f1 0.4458, margin 0.1056 (pass), ece_post 0.2224 (FAIL > 0.10), t_fitted = t_applied = 3.1436, clamp_hit false'
  fail_closed_rule: 'Both runs stay FAIL-CLOSED TEST VECTORS OF THE VERIFIER (rewritten 1.4.0 to agree with FALSIFY-LAYA-GATE-010; resolves D-ITEM-08-09-C under the user''s 2026-09-27 instruction on the vectors). pack-for-serving and `pack_laya verify` MUST refuse each on its exact bytes with its documented refusal and write nothing: early_stopping 3d4b91da… refuses GateFailed naming ONLY the ece_post clause (exit 3), the gate recomputed in Rust from eval-probs.json / zero-shot-probs.json; fixed_epochs d0f4e40d… refuses RescoreDrift on the fine-tuned re-score (exit 2), before its gate is reached. Under 1.4.0 both run dirs carry no rescore-noise record and no seed_selection, so they are held to the 1.0e-5 floor (laya-parity-v1 A1 absent-record rule) and to the legacy seed rule (seed_policy.legacy_rule), and their documented refusals are UNCHANGED (plan 08-15 re-derives them on the real run dirs). Nothing is packed for serving, uploaded or deployed from either. The Python gate self-test (just laya-train-selftest) decides FAIL on both reports'' numbers.'
